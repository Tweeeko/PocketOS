<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketOS settings</title>
<style>
:root{--bg:#05060b;--ink:#f1f3ff;--dim:#8b91ae;--blue:#6aa7ff;--vio:#9b7bff;--glass:rgba(255,255,255,.065);--line:rgba(255,255,255,.14);--ok:#7be3a4;--bad:#ff7a8a;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#05060b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(60% 40% at 15% 0,rgba(106,167,255,.2),transparent 70%),radial-gradient(60% 40% at 95% 30%,rgba(155,123,255,.16),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 "SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:0 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 6px}
header b{font-size:22px;letter-spacing:-.02em;display:block}header span{font-size:13px;color:var(--dim)}
.pill{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--glass);display:flex;gap:7px;align-items:center}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}.pill.bad::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.edit{font-size:13px;color:var(--dim);margin:2px 2px 14px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{margin:0 0 4px;font-size:17px}.card p{margin:4px 0 10px;color:var(--dim);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{padding:12px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}.st small{display:block;color:var(--dim);font-size:12px}.st b{font-size:15px}.st.bad b{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.row:first-of-type{border-top:0}.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px}.row .t small{color:var(--dim);font-size:12.5px}
h3{margin:18px 4px 8px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em}
.btn{border:0;border-radius:14px;padding:12px 16px;font:600 15px system-ui;color:#fff;background:linear-gradient(135deg,var(--blue),var(--vio));box-shadow:0 6px 18px rgba(106,167,255,.28)}
.btn.g{background:var(--glass);border:1px solid var(--line);box-shadow:none;color:var(--ink)}.btn.d{background:rgba(255,90,110,.18);border:1px solid rgba(255,90,110,.5);box-shadow:none;color:#ffb3bd}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input[type=text],input[type=password]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font:16px system-ui}
input[type=range]{width:100%;accent-color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:60px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:15px system-ui}.seg button.on{border-color:var(--blue);background:rgba(106,167,255,.2)}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0}.sw i{position:absolute;inset:0;border-radius:14px;background:#2a2d3b;transition:.2s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--blue)}.sw input:checked+i::after{left:23px}
.star{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:18px}.star.on{color:#ffd166;border-color:#ffd166}
.banner{display:flex;gap:12px;align-items:center;border-color:rgba(106,167,255,.5)}.banner .t{flex:1}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 24px));display:flex;padding:6px;border-radius:24px;background:rgba(18,20,34,.72);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 12px 40px #000}
nav button{flex:1;padding:11px 0;border:0;background:transparent;color:var(--dim);font:600 13px system-ui;border-radius:18px}nav button.on{color:var(--ink);background:rgba(106,167,255,.22)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);padding:11px 18px;border-radius:16px;background:rgba(20,22,36,.96);border:1px solid var(--line);font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.modal .card{max-width:380px;width:100%;margin:0}
.pair{text-align:center;padding-top:12vh}.pair h1{font-size:30px;letter-spacing:-.03em;margin:8px 0}.pin{font:600 30px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.pv{width:128px;height:128px;border-radius:50%;flex:none;background:radial-gradient(60% 60% at 30% 25%,rgba(106,167,255,.3),transparent 70%),radial-gradient(60% 60% at 75% 80%,rgba(155,123,255,.28),transparent 70%),#000;border:3px solid #3a3d4c;box-shadow:0 0 0 2px #1a1c26,0 10px 30px #000;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.pc{display:flex;gap:14px;margin-top:6px}.pc u{width:11px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.ptm{font-size:15px;font-weight:600}.pcp{font-size:10px;color:var(--dim)}.pt{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:88px}.pt i{font-style:normal;font-size:9px;padding:9px 4px;text-align:center;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stp{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}.stp i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}.stp i.on{background:var(--blue);width:22px;border-radius:4px}ol.how{padding-left:20px;margin:6px 0}ol.how li{margin:9px 0}.opt{display:block;width:100%;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:16px system-ui;margin-bottom:10px}.opt b{display:block}.opt small{color:var(--dim)}.star:disabled{opacity:.3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"></div><div id="toast"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),E=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CT={light:'On, off and brightness',plug:'On and off',fan:'On, off and speed',media:'Play, pause, skip and volume',climate:'Target temperature and heating on/off',lock:'Lock and unlock',sensor:'Shows a live reading',cover:'Open, close and position'};
const mk=(name,id)=>({name,id,wz:id==='a1b2'?0:99,tiles:[{k:'Favourites',n:'Favourites',s:1},{k:'Lights',n:'Lights',s:1},{k:'Heating',n:'Heating',s:1},{k:'Media',n:'Media',s:1},{k:'Locks',n:'Locks',s:1},{k:'Rooms',n:'Rooms',s:1},{k:'Scenes',n:'Scenes',s:1}],pair:0,clock:24,date:0,bright:80,timeout:1,eye:0,anim:1,tip:1,ha:{url:'http://homeassistant.local:8123',on:1},
rooms:[{n:'Living room',d:[{n:'Floor lamp',t:'light',s:1,f:1},{n:'TV',t:'media',s:1,f:0},{n:'Thermostat',t:'climate',s:1,f:0}]},{n:'Kitchen',d:[{n:'Ceiling light',t:'light',s:1,f:0},{n:'Kettle plug',t:'plug',s:1,f:0}]},{n:'Bedroom',d:[{n:'Blinds',t:'cover',s:1,f:0},{n:'Fan',t:'fan',s:1,f:0}]},{n:'Hallway',d:[{n:'Front door',t:'lock',s:1,f:1}]}],
sc:[{n:'Goodnight',s:1,f:1},{n:'Morning',s:1,f:0},{n:'Movie time',s:1,f:0}],
nf:[{n:'Hue Go lamp',r:'Bedroom',t:'light'},{n:'Aqara motion sensor',r:'Hallway',t:'sensor'},{n:'Sonos Move',r:'Kitchen',t:'media'}]});
const DV=[mk('Living room PocketOS','a1b2'),mk('Bedroom PocketOS','c3d4')];let cur=0,St=DV[0],tab='home',down=0,seen=Date.now();
function note(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(note.t);note.t=setTimeout(()=>t.className='',2600)}
function commit(fn,ok){note('Saving to '+St.name+'…');setTimeout(()=>{if(down){note('Couldn’t reach PocketOS. Nothing was changed.',1)}else{fn();seen=Date.now();note(ok||'Saved on PocketOS ✓')}render()},650)}
function ask(title,text,btn,fn){$('#modal').innerHTML='<div class="modal"><div class="card"><h2>'+title+'</h2><p>'+text+'</p><div class="btns"><button class="btn g" data-a="x">Cancel</button><button class="btn d" data-a="go">'+btn+'</button></div></div></div>';ask.f=fn}
const sw=(k,v,x='')=>'<label class="sw"><input type="checkbox" data-k="'+k+'" '+x+(v?' checked':'')+'><i></i></label>';
const seg=(k,names,v)=>'<div class="seg">'+names.map((n,i)=>'<button data-a="seg" data-k="'+k+'" data-v="'+i+'" class="'+(i==v?'on':'')+'">'+n+'</button>').join('')+'</div>';
const st=(l,v,b)=>'<div class="st'+(b?' bad':'')+'"><small>'+l+'</small><b>'+v+'</b></div>';
function ago(){const s=Math.round((Date.now()-seen)/1000);return down?'Over a minute ago':s<8?'Just now':s<60?s+' seconds ago':Math.round(s/60)+' min ago'}
function clk(){const d=new Date();let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');h=St.clock==12?(h%12||12):String(h).padStart(2,'0');return h+':'+m}
const EC=['#6aa7ff','#9b7bff','#e8ecff'];
function prev(mode){const s=St,fv=s.rooms.flatMap(r=>r.d).filter(d=>d.f&&d.s);let b;
if(mode==='tiles')b='<div class="pt">'+s.tiles.filter(x=>x.s).slice(0,4).map(x=>'<i>'+esc(x.n)+'</i>').join('')+'</div>';
else b='<div class="pc" style="color:'+EC[s.eye]+'"><u></u><u></u></div><div class="ptm">'+clk()+'</div><div class="pcp">'+(fv.length?fv.length+' favourites':'No favourites yet')+'</div>';
return '<div class="card" style="display:flex;gap:14px;align-items:center"><div class="pv" style="filter:brightness('+(.4+s.bright*.006)+')">'+b+'</div><div><h2>'+(mode==='tiles'?'Menu preview':'Live preview')+'</h2><p style="margin:0">'+(mode==='tiles'?'The first four tiles on your PocketOS menu.':'How your PocketOS looks. It updates once PocketOS confirms a change.')+'</p></div></div>'}
function tilesCard(){const s=St;return prev('tiles')+'<div class="card"><h2>Menu tiles</h2><p>Choose what appears on the PocketOS menu and in what order. The screen shows four at a time, and you swipe for more.</p>'+s.tiles.map((t,i)=>'<div class="row"><div class="t"><input type="text" value="'+esc(t.n)+'" maxlength="12" data-k="tn" data-i="'+i+'"></div><button class="star" data-a="up" data-v="'+i+'" '+(i?'':'disabled')+'>▲</button><button class="star" data-a="dn" data-v="'+i+'" '+(i<s.tiles.length-1?'':'disabled')+'>▼</button>'+sw('ts',t.s,'data-i="'+i+'"')+'</div>').join('')+'</div>'}
let wf='HomeNet';const NETS=['HomeNet','BT-Hub-7F2','Guest-5G'];
function wizV(){const s=St,z=s.wz,p=[0,1,2,2,2,3,4][z]||0;let b;
if(z==0)b='<h2>Let’s set up '+esc(s.name)+'</h2><p>It takes about five minutes. You can change everything afterwards, and nothing leaves your home network.</p><div class="btns"><button class="btn" data-a="wz" data-v="1">Start</button></div>';
else if(z==1)b='<h2>Pick your Wi-Fi</h2><p>PocketOS works on 2.4 GHz Wi-Fi, which most routers share by default.</p>'+NETS.map(n=>'<button class="opt" data-a="wnet" data-v="'+n+'" style="'+(n==wf?'border-color:var(--blue)':'')+'"><b>'+n+'</b></button>').join('')+'<input type="password" id="wpw" placeholder="Wi-Fi password"><div class="btns"><button class="btn" data-a="wifi">Connect</button></div>';
else if(z==2)b='<h2>Do you use Home Assistant?</h2><p>It’s a free app that links smart-home brands together so PocketOS can control them. Alexa, Google Home or Apple Home on their own aren’t Home Assistant.</p><button class="opt" data-a="wz" data-v="4"><b>Yes, I use it</b><small>Connect it now</small></button><button class="opt" data-a="wz" data-v="3"><b>No, or I’m not sure</b><small>See what you’d need</small></button>';
else if(z==3)b='<h2>Getting Home Assistant</h2><p>It needs to run at home, for example on a Home Assistant Green box, a Raspberry Pi or a spare PC. Your smart devices are then added inside it.</p><div class="btns"><a class="btn" style="text-decoration:none" href="https://www.home-assistant.io/installation/" target="_blank" rel="noopener">How to install ↗</a><button class="btn g" data-a="wz" data-v="6">Skip for now</button><button class="btn g" data-a="wz" data-v="2">Back</button></div><p style="margin-top:12px">Without it, PocketOS still shows its companion, clock and moods.</p>';
else if(z==4)b='<h2>Connect Home Assistant</h2><p>PocketOS gets its own limited login, so your main account stays private.</p><ol class="how"><li><a href="'+esc(s.ha.url)+'" target="_blank" rel="noopener" style="color:var(--blue)">Open Home Assistant ↗</a></li><li>Go to <b>Settings → People → Add person</b>. Name it PocketOS, allow login, and leave <b>Administrator</b> off.</li><li>Sign in as PocketOS (a private browser window is easiest).</li><li>Tap its name at the bottom left, open <b>Security</b>, and under <b>Long-lived access tokens</b> choose <b>Create token</b>. Copy it.</li><li>Paste it below.</li></ol><small style="color:var(--dim)">Menu names can differ slightly between Home Assistant versions.</small><p style="margin-top:12px">Address</p><input type="text" id="wurl" value="'+esc(s.ha.url)+'"><p>Token</p><input type="password" id="wtok" placeholder="Paste token"><div class="btns"><button class="btn" data-a="wizha">Test and connect</button><button class="btn g" data-a="wz" data-v="2">Back</button></div><div id="wmsg" class="err"></div>';
else if(z==5)b='<h2>Pick your favourites</h2><p>Favourites get quick access on PocketOS. You can change these any time.</p>'+s.rooms.flatMap((r,ri)=>r.d.map((d,di)=>d.t==='sensor'?'':'<div class="row"><div class="t"><b>'+esc(d.n)+'</b><small>'+esc(r.n)+'</small></div>'+sw('wfav',d.f,'data-r="'+ri+'" data-d="'+di+'"')+'</div>')).join('')+'<div class="btns"><button class="btn" data-a="wz" data-v="6">Finish</button></div>';
else b='<h2>All set</h2><p>'+(s.ha.on?'PocketOS now shows your rooms, devices and scenes.':'PocketOS is ready with its companion and clock. Connect Home Assistant any time from the Smart home tab.')+'</p><div class="btns"><button class="btn" data-a="wz" data-v="99">Go to my dashboard</button></div>';
return head()+'<div class="stp">'+[0,1,2,3,4].map(i=>'<i class="'+(i==p?'on':'')+'"></i>').join('')+'</div><div class="card">'+b+'</div>'+(z<6?'<div class="btns" style="justify-content:center"><button class="btn g" data-a="wz" data-v="99">Skip setup for now</button></div>':'')}
function homeV(){const s=St,errs=[];if(down)errs.push('PocketOS isn’t answering');if(!s.ha.on)errs.push('Home Assistant is disconnected');
return '<div class="card"><h2>'+esc(s.name)+'</h2><p>Everything is working as it should.</p>'.replace('Everything is working as it should.',errs.length?errs.join('. ')+'.':'Everything is working as it should.')+'<div class="grid">'+st('Wi-Fi',down?'—':'HomeNet · strong')+st('Home Assistant',s.ha.on&&!down?'Connected':'Not connected',!s.ha.on)+st('Firmware','v0.1.0')+st('Battery',down?'—':'78%')+st('Last connected',ago())+st('Health',errs.length?errs.length+' issue':'All good',errs.length)+'</div></div>'
+(s.nf.length?'<div class="card banner"><div class="t"><h2>'+s.nf.length+' new devices found</h2><p style="margin:0">Added in Home Assistant since you last looked.</p></div><button class="btn" data-a="tab" data-v="dev">Review</button></div>':'')
+(s.tip?'<div class="card"><h2>Keep this page handy</h2><p>On iPhone or iPad tap Share, then <b>Add to Home Screen</b>. You can always reopen it from your PocketOS: <b>Settings → Open settings website</b> shows a code to scan.</p><div class="btns"><button class="btn g" data-a="tip">Got it</button></div></div>':'')}
function devV(){const s=St;let h=prev('home');
if(s.nf.length)h+='<h3>New in Home Assistant</h3><div class="card">'+s.nf.map((d,i)=>'<div class="row"><div class="t"><b>'+esc(d.n)+'</b><small>'+esc(d.r)+' · '+CT[d.t]+'</small></div><button class="btn" data-a="add" data-v="'+i+'">Add</button><button class="btn g" data-a="ign" data-v="'+i+'">Skip</button></div>').join('')+'</div>';
h+=s.rooms.map((r,ri)=>'<h3>'+esc(r.n)+'</h3><div class="card">'+r.d.map((d,di)=>'<div class="row"><div class="t"><b>'+esc(d.n)+'</b><small>'+CT[d.t]+'</small></div><button class="star '+(d.f?'on':'')+'" data-a="fav" data-r="'+ri+'" data-v="'+di+'" aria-label="Favourite">★</button>'+sw('show',d.s,'data-r="'+ri+'" data-d="'+di+'"')+'</div>').join('')+'</div>').join('');
h+='<h3>Scenes</h3><div class="card">'+s.sc.map((d,i)=>'<div class="row"><div class="t"><b>'+esc(d.n)+'</b><small>Runs with one tap</small></div><button class="star '+(d.f?'on':'')+'" data-a="sfav" data-v="'+i+'">★</button>'+sw('sshow',d.s,'data-d="'+i+'"')+'</div>').join('')+'</div><p class="edit">Star = favourite on PocketOS. Switch = show or hide. Only controls your devices really support are listed.</p>';return h}
function lookV(){const s=St;return prev('home')+tilesCard()+'<div class="card"><h2>Name</h2><p>Shown here and on its Settings screen.</p><input type="text" id="nm" value="'+esc(s.name)+'" maxlength="24"><div class="btns"><button class="btn" data-a="name">Save name</button></div></div>'
+'<div class="card"><h2>Clock and date</h2><p>Time zone follows your home Wi-Fi automatically (Europe/London).</p>'+seg('clock',['24-hour','12-hour'],s.clock==24?0:1)+'<div style="height:8px"></div>'+seg('date',['Day / Month','Month / Day'],s.date)+'</div>'
+'<div class="card"><h2>Screen</h2><p>Brightness '+s.bright+'%</p><input type="range" min="10" max="100" step="5" value="'+s.bright+'" data-k="bright"><p style="margin-top:12px">Sleep after</p>'+seg('timeout',['15 s','30 s','1 min','Never'],s.timeout)+'</div>'
+'<div class="card"><h2>Companion</h2><p>Eye colour</p>'+seg('eye',['Blue','Violet','White'],s.eye)+'<p style="margin-top:12px">Animation</p>'+seg('anim',['Calm','Lively','Off'],s.anim)+'</div>'}
function haV(){const s=St;return '<div class="card"><h2>Home Assistant</h2><p>'+(s.ha.on?'Connected to '+esc(s.ha.url):'Not connected')+'</p><input type="text" id="url" value="'+esc(s.ha.url)+'" autocapitalize="off" autocorrect="off"><p style="margin-top:12px">Access token</p><input type="password" id="tok" placeholder="Paste a token (kept on PocketOS only)"><p>Use a token from a dedicated, non-admin Home Assistant user. Home Assistant tokens aren’t limited in scope, so this keeps your main login out of it.</p><div class="btns"><button class="btn g" data-a="test">Test connection</button>'+(s.ha.on?'<button class="btn d" data-a="disc">Disconnect</button>':'<button class="btn" data-a="conn">Connect</button>')+'</div><div id="hmsg"></div></div>'
+'<div class="card"><h2>Need help connecting?</h2><p>New to Home Assistant? We’ll walk you through it step by step.</p><div class="btns"><button class="btn" data-a="wz" data-v="4">Guide me</button><button class="btn g" data-a="wz" data-v="3">I don’t have Home Assistant</button></div></div>'
+'<div class="card"><h2>Add more smart devices</h2><p>New lights, plugs and speakers are linked to their brand inside Home Assistant. Once they’re there, PocketOS finds them.</p><div class="btns"><a class="btn g" style="text-decoration:none" href="'+esc(s.ha.url)+'/config/integrations" target="_blank" rel="noopener">Open Home Assistant ↗</a><button class="btn" data-a="find">Look for new devices</button></div></div>'}
function moreV(){const s=St;return '<div class="card"><h2>This PocketOS</h2><div class="grid">'+st('Name',esc(s.name))+st('Device ID',s.id)+st('Firmware','v0.1.0')+st('Updates','Up to date')+'</div><div class="btns"><button class="btn g" data-a="swap">Switch to my other PocketOS</button></div><p>Each PocketOS keeps its own settings. Always check the name at the top before saving.</p></div>'
+'<div class="card"><h2>Maintenance</h2><div class="btns"><button class="btn g" data-a="wz" data-v="0">Run setup again</button><button class="btn g" data-a="rest">Restart</button><button class="btn g" data-a="defl">Restore look to default</button><button class="btn d" data-a="reset">Reset everything</button></div></div>'
+'<div class="card"><h2>Demo controls</h2><div class="row"><div class="t"><b>Pretend the device is unreachable</b><small>Shows how failed saves are handled</small></div>'+sw('down',down)+'</div></div>'}
function head(){return '<header><div><b>'+esc(St.name)+'</b><span>PocketOS · '+St.id+'</span></div><div class="pill '+(down?'bad':'')+'">'+(down?'Can’t reach':'Connected')+'</div></header><div class="edit">You’re changing this PocketOS only.</div>'}
const TABS=[['home','Home'],['dev','Devices'],['look','Look'],['ha','Smart home'],['more','More']];
function render(){if(!St.pair){E.innerHTML='<div class="pair"><div class="card"><div style="font-size:42px">◉</div><h1>Connect to your PocketOS</h1><p>Enter the 6-digit code shown on the PocketOS screen. You only do this once on each phone.</p><input class="pin" id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="······"><div id="perr" class="err"></div><div class="btns" style="justify-content:center"><button class="btn" data-a="pair">Connect</button></div><p style="margin-top:14px">Demo code: 482913</p></div></div>';return}
if(St.wz<99){E.innerHTML=wizV();return}const v={home:homeV,dev:devV,look:lookV,ha:haV,more:moreV}[tab]();E.innerHTML=head()+'<main>'+v+'</main><nav>'+TABS.map(t=>'<button data-a="tab" data-v="'+t[0]+'" class="'+(tab==t[0]?'on':'')+'">'+t[1]+(t[0]=='dev'&&St.nf.length?' •':'')+'</button>').join('')+'</nav>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,s=St;
if(a==='wz'){s.wz=+v;render();scrollTo(0,0)}
else if(a==='wnet'){wf=v;render()}
else if(a==='wifi'){if(!$('#wpw').value)return note('Enter the Wi-Fi password first',1);commit(()=>{s.wz=2},'Connected to '+wf+' ✓')}
else if(a==='wizha'){const u=$('#wurl').value,m=$('#wmsg');if(!$('#wtok').value){m.textContent='Paste the token from step 4 first.';return}if(/bad|nope/.test(u)){m.textContent='Couldn’t reach Home Assistant at that address. Check it’s on and on the same Wi-Fi.';return}m.textContent='';commit(()=>{s.ha.url=u;s.ha.on=1;s.wz=5},'Home Assistant connected ✓')}
else if(a==='tab'){tab=v;render();scrollTo(0,0)}
else if(a==='pair'){if($('#pin').value==='482913'){s.pair=1;render()}else $('#perr').textContent='That code doesn’t match. Check the PocketOS screen.'}
else if(a==='tip'){s.tip=0;render()}
else if(a==='seg'){const k=b.dataset.k,n=+v;commit(()=>{s[k]=k==='clock'?(n?12:24):n})}
else if(a==='name'){const n=$('#nm').value.trim();if(!n)return note('Give it a name first',1);commit(()=>{s.name=n.slice(0,24)},'Name saved on PocketOS ✓')}
else if(a==='fav')commit(()=>{const d=s.rooms[b.dataset.r].d[v];d.f^=1});
else if(a==='sfav')commit(()=>{s.sc[v].f^=1});
else if(a==='add')commit(()=>{const d=s.nf[v];let r=s.rooms.find(x=>x.n===d.r);if(!r){r={n:d.r,d:[]};s.rooms.push(r)}r.d.push({n:d.n,t:d.t,s:1,f:0});s.nf.splice(v,1)},'Added to PocketOS ✓');
else if(a==='ign')commit(()=>{s.nf.splice(v,1)},'Skipped');
else if(a==='test'){const u=$('#url').value,m=$('#hmsg');m.className='err';m.style.color='';if(/bad|nope/.test(u)||down){m.textContent='Couldn’t reach Home Assistant at that address. Check it’s turned on and on the same Wi-Fi.'}else{m.className='';m.style.color='#7be3a4';m.style.marginTop='8px';m.textContent='Success. Found 3 rooms, 6 devices and 3 scenes.'}}
else if(a==='conn')commit(()=>{s.ha.url=$('#url').value||s.ha.url;s.ha.on=1},'Connected to Home Assistant ✓');
else if(a==='disc')ask('Disconnect Home Assistant?','PocketOS will stop controlling your home until you reconnect.','Disconnect',()=>commit(()=>{s.ha.on=0},'Disconnected'));
else if(a==='find')commit(()=>{if(!s.nf.length)s.nf.push({n:'IKEA Tradfri bulb',r:'Bedroom',t:'light'})},s.nf.length?'Checked Home Assistant ✓':'Found 1 new device ✓');
else if(a==='swap'){cur^=1;St=DV[cur];tab='home';render();note('Now editing '+St.name)}
else if(a==='rest')ask('Restart '+esc(s.name)+'?','It will be back in about 20 seconds. Your settings stay as they are.','Restart',()=>commit(()=>{},'Restarting…'));
else if(a==='defl')ask('Restore look to default?','Clock, brightness and companion go back to normal. Your devices and Home Assistant stay as they are.','Restore',()=>commit(()=>{Object.assign(s,{clock:24,date:0,bright:80,timeout:1,eye:0,anim:1})},'Defaults restored ✓'));
else if(a==='reset')ask('Reset everything?','This erases Wi-Fi, Home Assistant and all choices on '+esc(s.name)+'. It will return to first-time setup. You’ll also confirm with a side button on the device.','Erase it',()=>commit(()=>{DV[cur]=mk(s.name,s.id);St=DV[cur];St.wz=0},'Reset. Starting setup again'));
else if(a==='up'||a==='dn'){const i=+v,j=a==='up'?i-1:i+1;commit(()=>{[s.tiles[i],s.tiles[j]]=[s.tiles[j],s.tiles[i]]},'Menu order saved ✓')}
else if(a==='x')$('#modal').innerHTML='';
else if(a==='go'){const f=ask.f;$('#modal').innerHTML='';f&&f()}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.k,s=St;if(!k)return;
if(k==='down'){down=t.checked?1:0;render();return}
if(k==='bright'){const n=+t.value;commit(()=>{s.bright=n})}
else if(k==='show'){const d=s.rooms[t.dataset.r].d[t.dataset.d],c=t.checked;commit(()=>{d.s=c?1:0})}
else if(k==='sshow'){const d=s.sc[t.dataset.d],c=t.checked;commit(()=>{d.s=c?1:0})}
else if(k==='tn'){const i=+t.dataset.i,n=t.value.trim();commit(()=>{if(n)s.tiles[i].n=n.slice(0,12)},'Tile renamed ✓')}
else if(k==='ts'){const i=+t.dataset.i,c=t.checked;commit(()=>{s.tiles[i].s=c?1:0})}
else if(k==='wfav'){const d=s.rooms[t.dataset.r].d[t.dataset.d],c=t.checked;commit(()=>{d.f=c?1:0})}});
setInterval(()=>{if(St.pair&&tab==='home'&&!down&&!document.activeElement?.closest('input')){render()}},15000);
render();
</script></body></html>
