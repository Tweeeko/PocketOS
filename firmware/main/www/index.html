/* Looks and moves like PocketOS itself: black glass, soft blue and violet light, glass tiles and
   rounded list rows, the same Inter type, and "‹ Title" to go back (or swipe right). */
:root{--bg:#04050b;--ink:#f1f3ff;--dim:#8b91ae;--blue:#6aa7ff;--vio:#9b7bff;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--ok:#7be3a4;--warn:#ffd166;--bad:#ff7a8a;--f:"PInter",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased;font-synthesis:none;
  background:radial-gradient(70% 45% at 10% -5%,rgba(106,167,255,.22),transparent 70%),radial-gradient(60% 45% at 100% 55%,rgba(155,123,255,.17),transparent 70%),radial-gradient(50% 35% at 30% 105%,rgba(106,167,255,.12),transparent 70%),var(--bg);background-attachment:fixed}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{max-width:520px;margin:0 auto;padding:0 16px 90px}
a{color:var(--blue)}
button,input,select,textarea{font-family:var(--f)}
/* top bar: centred title like PocketOS's lists, back on the left, connection on the right */
header{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:18px 0 10px;position:sticky;top:0;z-index:6;margin:0 -16px;padding-left:16px;padding-right:16px;
  background:linear-gradient(180deg,rgba(4,5,11,.92) 60%,rgba(4,5,11,0));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
header .t{min-width:0;text-align:center}header b{font-size:18px;font-weight:600;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header span{font-size:12.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));color:var(--ink);font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pill{flex:none;font-size:12.5px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:rgba(20,22,36,.7);display:flex;gap:7px;align-items:center;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}.pill.bad::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}.pill.warn::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.edit{font-size:13px;color:var(--dim);margin:2px 4px 14px;text-align:center}
/* glass, as on PocketOS */
.card,.tile,.grp .row,.opt,.modal .card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 55%,rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -14px 30px -18px rgba(155,123,255,.25),0 14px 34px -18px rgba(0,0,0,.9)}
.card{border-radius:26px;padding:18px;margin:0 0 14px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}.card p{margin:4px 0 10px;color:var(--dim);font-size:14px}.card p.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{padding:12px 14px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);min-width:0}.st small{display:block;color:var(--dim);font-size:12px}.st b{font-size:15px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st.bad b{color:var(--bad)}.st.warn b{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.row:first-child{border-top:0}.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t small{display:block;color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* device lists: each device its own rounded glass row, like PocketOS's lists */
.grp .card{background:none;border:0;box-shadow:none;padding:0;margin:0 0 6px}
.grp .row{border-radius:24px;padding:10px 12px 10px 20px;margin:0 0 8px;min-height:58px}
.grp .row:first-child{border-top:1px solid rgba(255,255,255,.14)}
h3{margin:20px 6px 8px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.09em}
/* buttons: rounded glass; the main action glows blue-violet like PocketOS's power button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(170,180,255,.5);border-radius:999px;padding:12px 20px;font:600 15px var(--f);color:#fff;text-decoration:none;cursor:pointer;
  background:linear-gradient(160deg,rgba(128,150,255,.62),rgba(120,92,230,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 26px -10px rgba(110,120,255,.75)}
.btn.g{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);color:var(--ink)}
.btn.d{background:linear-gradient(160deg,rgba(255,110,130,.3),rgba(255,90,110,.14));border-color:rgba(255,120,140,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);color:#ffc2ca}
.btn.s{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label.f{display:block;font-size:13px;color:var(--dim);margin:14px 4px 6px}
input[type=text],input[type=password],input[type=url],input[type=search],select{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:18px;color:var(--ink);padding:13px 16px;font:16px var(--f);outline:none}

async function api(path,opt={}){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),opt.timeout||12000);

  let body=opt.body;if(body!==undefined&&!(body instanceof Blob)&&!(body instanceof ArrayBuffer)){h['Content-Type']='application/json';body=JSON.stringify(body)}

    const r=await fetch(API+path,{method:opt.method||(body!==undefined?'POST':'GET'),headers:h,body,signal:ctl.signal,cache:'no-store'});

async function save(patch,okMsg){
  note('Saving to '+(cfg?cfg.name:'PocketOS')+'…');
  const r=await api('/config',{body:patch});
  if(r.ok&&r.data&&r.data.name!==undefined){cfg=r.data;note(okMsg||'Saved on PocketOS ✓','good')}
  else note(r.msg,'bad');
  render();return r.ok;
}
async function setFlag(id,flags,okMsg){
  note('Saving…');
  const r=await api('/entities',{body:Object.assign({id},flags)});
  if(r.ok){const e=ents&&ents.entities.find(x=>x.id===id);if(e)Object.assign(e,flags.known?{new:false}:{},flags.fav!==undefined?{fav:flags.fav}:{},flags.hidden!==undefined?{hidden:flags.hidden}:{});if(cfg&&flags.fav!==undefined){cfg.favourites=cfg.favourites.filter(x=>x!==id);if(flags.fav)cfg.favourites.push(id)}note(okMsg||'Saved on PocketOS ✓','good');refreshInfo(true)}

}

      '<div id="man" class="'+(s.manual?'':'hide')+'"><label class="f" for="ssid">Network name</label><input type="text" id="ssid" autocapitalize="off" autocorrect="off" maxlength="32" value="'+esc(s.manual&&s.pick||'')+'"></div>'+

/* Test, save, then wait until PocketOS itself reports it's connected. */
async function connectHA(url,tok,msgEl,btn){
  const set=(t,ok)=>{msgEl.className=ok?'okm':'err';msgEl.innerHTML=t};
  url=url.trim().replace(/\/+$/,'');
  if(!/^https?:\/\/[^\s/]+/i.test(url)){set('The address should look like http://homeassistant.local:8123');return false}
  if(!tok&&!(cfg&&cfg.ha_token_set)){set('Paste the token first.');return false}
  const lbl=btn&&btn.textContent;if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>Testing…'}
  const done=ok=>{if(btn){btn.disabled=false;btn.textContent=lbl}return ok};
  const t=await api('/ha/test',{body:{url,token:tok},timeout:20000});
  if(!t.ok){set(esc(t.msg));return done(false)}
  if(btn)btn.innerHTML='<span class="spin"></span>Connecting…';
  const r=await api('/ha',{body:{url,token:tok}});
  if(!r.ok){set(esc(r.msg));return done(false)}
  await loadCfg();
  for(let i=0;i<15;i++){await new Promise(z=>setTimeout(z,1500));await loadInfo();
    if(info.ha.status==='connected'){set('Connected ✓ PocketOS can see '+info.ha.devices+' devices.',true);await loadEnts();return done(true)}
    if(info.ha.status==='error'){set(esc(info.ha.error||'Home Assistant refused the connection.'));return done(false)}}
  set('Saved, but PocketOS hasn’t connected yet. Check the address and that Home Assistant is running.');return done(false);
}


/* ---------- battery ---------- */
async function loadBatt(){const r=await api('/battery');if(r.ok&&r.data){batt=r.data;battAt=Date.now()}return r.ok}
const hrs=h=>h<1?'under an hour':h<36?Math.round(h)+' hours':(Math.round(h/2.4)/10)+' days';
function ago(ts){const s=Math.max(0,Date.now()/1000-ts);if(s<90)return 'just now';if(s<5400)return Math.round(s/60)+' minutes ago';if(s<129600)return Math.round(s/3600)+' hours ago';return Math.round(s/86400)+' days ago'}
function battChart(b){
  const now=b.now||Date.now()/1000,t0=now-48*3600,H=b.history.filter(r=>r[0]>=t0);
  if(H.length<2)return '<p style="font-size:13px">The chart fills in over the next few hours.</p>';
  const W=320,Ht=112,L=30,T=6,B=20,x=t=>L+(t-t0)/(now-t0)*(W-L-4),y=p=>T+(100-p)/100*(Ht-T-B);
  let shade='',line='',d='';
  for(let i=0;i<H.length;i++){const r=H[i],gap=i&&r[0]-H[i-1][0]>7200;
    d+=(i===0||gap?'M':'L')+x(r[0]).toFixed(1)+' '+y(r[1]).toFixed(1);
    if(r[3]&2){const e=i<H.length-1?H[i+1][0]:now;shade+='<rect x="'+x(r[0]).toFixed(1)+'" y="'+T+'" width="'+Math.max(1,x(e)-x(r[0])).toFixed(1)+'" height="'+(Ht-T-B)+'" fill="rgba(123,227,164,.13)"/>'}}
  const grid=[0,50,100].map(p=>'<line x1="'+L+'" x2="'+(W-4)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="rgba(255,255,255,.08)"/><text x="'+(L-6)+'" y="'+(y(p)+4)+'" text-anchor="end" font-size="10" fill="#8b91ae">'+p+'%</text>').join('');
  const xl=[[t0,'48 h ago','start'],[now-24*3600,'24 h','middle'],[now,'now','end']].map(a=>'<text x="'+x(a[0])+'" y="'+(Ht-5)+'" text-anchor="'+a[2]+'" font-size="10" fill="#8b91ae">'+a[1]+'</text>').join('');
  line='<path d="'+d+'" fill="none" stroke="#6aa7ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="Battery level over the last 48 hours" style="display:block;margin-top:8px">'+grid+shade+line+xl+'</svg><p style="font-size:12px;margin:2px 0 0"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(123,227,164,.35);vertical-align:-1px"></span> Plugged in</p>';
}
function battCard(){
  if(Date.now()-battAt>55000)loadBatt().then(()=>{if(tab==='home'&&canRerender()&&!wiz)render()});
  const b=batt;
  if(!b)return '<div class="card"><h2>Battery</h2><p><span class="spin"></span>Reading the battery…</p></div>';
  if(!b.present)return '<div class="card"><h2>Battery</h2><p>No battery found. PocketOS is running from USB power.</p></div>';
  const e=b.estimate||{},state=b.charging?'Charging':b.plugged?(b.full||b.percent>=100?'Plugged in · full':'Plugged in'):'On battery';
  let est=e.known&&e.hours_left!=null?'About <b>'+hrs(e.hours_left)+'</b> left, going by how you’ve used it lately.':e.known?'A full charge lasts about <b>'+hrs(e.full_h)+'</b> with your use.':'Still learning how long a charge lasts. Check back after a few hours off the charger.';
  return '<div class="card"><h2>Battery</h2><div style="display:flex;align-items:baseline;gap:10px"><b style="font-size:34px;letter-spacing:-.02em">'+(b.percent!=null?b.percent+'%':'—')+'</b><span style="color:var(--dim);font-size:14px">'+state+(b.mv?' · '+(b.mv/1000).toFixed(2)+' V':'')+'</span></div><p style="margin-top:6px">'+est+(e.known?' <span style="font-size:12px">(from '+Math.round(e.basis_h)+' h of readings)</span>':'')+'</p>'+battChart(b)+(b.last_full?'<p style="font-size:13px;margin-top:8px">Last fully charged '+ago(b.last_full)+'.</p>':'')+'</div>';
}

async function watchUpdate(target){
  if(updWatching)return;updWatching=true;const t0=Date.now();let gone=false;
  while(Date.now()-t0<240000){await new Promise(z=>setTimeout(z,1500));
    const ok=await loadInfo();
    if(!ok){if(!gone){gone=true;sheet('<h2><span class="spin"></span>Installing</h2><p>PocketOS is restarting into version '+esc(target)+'. This page reconnects by itself.</p>')}continue}
    if(info.firmware===target){closeModal();updWatching=false;batt=null;battAt=0;render();note('Now running v'+target+' ✓','good');return}
    if(gone){closeModal();updWatching=false;render();note('PocketOS restarted on v'+info.firmware+'. The new version didn’t start properly, so it went back by itself.','bad');return}
    const u=info.update||{};
    if(u.state!=='downloading'&&u.state!=='installed'){updWatching=false;if(canRerender())render();if(u.error)note('Update failed: '+u.error+'. Nothing changed.','bad');return}
    if(canRerender()&&(tab==='home'||tab==='more'))render()}
  updWatching=false;closeModal();note('PocketOS hasn’t come back yet. Check its screen, then reload this page.','bad');
}

}

async function uploadFw(f){
  const m=$('#fwm');m.className='';
  const head=new Uint8Array(await f.slice(0,112).arrayBuffer()),dv=new DataView(head.buffer);
  const str=(a,b)=>new TextDecoder().decode(head.slice(a,b)).replace(/\0.*$/s,'');
  if(head.length<112||head[0]!==0xE9||dv.getUint32(32,true)!==0xABCD5432){m.className='err';m.textContent=f.name.includes('full')?'That’s the full-flash file for a computer. Choose pocketos.bin instead.':'That isn’t a PocketOS firmware file.';return}
  const ver=str(48,80),proj=str(80,112);
  if(proj!=='pocketos'){m.className='err';m.textContent='That firmware is for “'+proj+'”, not PocketOS.';return}
  if(f.size>6*1024*1024){m.className='err';m.textContent='That file is too big for PocketOS.';return}
  ask('Install version '+ver+'?','You’re on v'+esc(info.firmware)+'. PocketOS restarts when it’s done, which takes about a minute. Keep this page open and PocketOS charging.','Install',()=>{
    m.innerHTML='<p>Sending update…</p><div class="bar"><i id="fwb"></i></div>';
    const x=new XMLHttpRequest();x.open('POST',API+'/ota');x.setRequestHeader('Authorization','Bearer '+token);x.setRequestHeader('Content-Type','application/octet-stream');x.timeout=180000;
    x.upload.onprogress=e=>{if(e.lengthComputable)$('#fwb').style.width=Math.round(e.loaded/e.total*100)+'%'};
    x.onload=async()=>{let d={};try{d=JSON.parse(x.responseText)}catch(e){}
      if(x.status!==200){m.className='err';m.textContent=d.error||'Update failed. PocketOS is still on the old version.';return}
      m.innerHTML='<p><span class="spin"></span>Installed. Waiting for PocketOS to restart…</p>';
      const t0=Date.now();await new Promise(z=>setTimeout(z,5000));
      while(Date.now()-t0<120000){if(await loadInfo()&&info.firmware){if(info.firmware===ver){render();const n=$('#fwm');if(n)n.innerHTML='<p class="okm">Now running v'+esc(ver)+' ✓</p>';note('Updated to v'+ver+' ✓','good');return}else{m.className='err';m.textContent='PocketOS restarted on v'+info.firmware+'. The new version didn’t start properly, so it went back automatically.';return}}await new Promise(z=>setTimeout(z,3000))}
      m.className='err';m.textContent='PocketOS hasn’t come back yet. Check its screen, then reload this page.'};
    x.onerror=x.ontimeout=()=>{m.className='err';m.textContent='The upload stopped. PocketOS is still on the old version.'};
    x.send(f)});
}

  else if(a==='sstep'){setup.step=+v;render();if(setup.step===1&&!setup.nets)scan()}
  else if(a==='scan')scan();
  else if(a==='pick'){setup.pick=v;setup.manual=false;render();const p=$('#wpw');p&&p.focus()}
  else if(a==='manual'){setup.manual=true;setup.pick='';render();$('#ssid').focus()}
  else if(a==='join')join();
  else if(a==='pair')pair();
  else if(a==='wz'){wiz=v;if(v==='fav'&&!ents){loadEnts().then(render)}render();scrollTo(0,0)}
  else if(a==='wzend'){wiz=null;store.set(doneKey(),'1');tab='home';render();scrollTo(0,0)}
  else if(a==='wizha'){if(await connectHA($('#wurl').value,$('#wtok').value,$('#wmsg'),$('#wizb'))){await loadEnts();wiz='fav';render();scrollTo(0,0)}}
  else if(a==='tip'){store.set('pocketos-tip-a2hs','1');render()}
  else if(a==='buttons')sheet('<h2>Side buttons</h2>'+buttonsHtml()+'<div class="btns"><button class="btn" data-a="x">Done</button></div>');
  else if(a==='seg'){const k=b.dataset.k,val=JSON.parse(v);if(cfg[k]!==val)save({[k]:val})}
  else if(a==='name'){const n=$('#nm').value.trim();if(!n||bytes(n)>24)return note('Names are 1 to 24 characters','bad');if(n!==cfg.name)save({name:n},'Name saved on PocketOS ✓')}
  else if(a==='mv'){const i=+b.dataset.i,j=i+(+v);save({tiles:tilesWith(t=>{[t[i],t[j]]=[t[j],t[i]]})},'Menu order saved ✓')}
  else if(a==='defl')ask('Restore look to default?','Clock, brightness, sleep and companion go back to normal. Tiles, devices and Home Assistant stay as they are.','Restore',()=>save({brightness:80,clock_24h:true,date_format:'dmy',sleep_s:30,eye:'blue',anim:'lively',alerts:true},'Look restored ✓'));
  else if(a==='fav')setFlag(id,{fav:!b.classList.contains('on')});
  else if(a==='edit')editDev(id);
  else if(a==='rename')renameDev(id,$('#dn').value);
  else if(a==='haname'){const e=ents.entities.find(x=>x.id===id);if(e)renameDev(id,e.ha_name)}
  else if(a==='fmv'){note('Saving…');const r=await api('/entities',{body:{id,move:+v}});if(r.ok){await loadCfg();note('Order saved ✓','good')}else note(r.msg,'bad');render()}
  else if(a==='add')setFlag(id,{known:true,hidden:false},'Added to PocketOS ✓');
  else if(a==='skip')setFlag(id,{known:true,hidden:true},'Skipped. You can still show it later.');
  else if(a==='addall'){note('Saving…');const r=await api('/entities',{body:{all_known:true}});if(r.ok){ents.entities.forEach(x=>x.new=false);await loadInfo();note('All added ✓','good')}else note(r.msg,'bad');render()}
  else if(a==='reload'){ents=ents||null;entsLoading=true;render();await loadEnts();await loadInfo();render()}
  else if(a==='conn')connectHA($('#url').value,$('#tok').value,$('#hmsg'),$('#connb')).then(ok=>{if(ok)setTimeout(render,1500)});
  else if(a==='disc')ask('Disconnect Home Assistant?','PocketOS stops controlling your home and forgets the token. You can reconnect any time.','Disconnect',async()=>{note('Disconnecting…');const r=await api('/ha/disconnect',{body:{}});if(r.ok){await loadCfg();await loadInfo();ents=null;note('Disconnected','good')}else note(r.msg,'bad');render()},true);
  else if(a==='find'){note('Checking…');await loadInfo();await loadEnts();const n=info.ha.new;note(n?n+' new device'+(n>1?'s':'')+' found':cfg.auto_add?'Up to date. New devices appear by themselves.':'No new devices','good');if(n)go('dev');else render()}
  else if(a==='pickfw')$('#fw').click();
  else if(a==='updcheck')checkUpdate();
  else if(a==='updinstall'){const u=info.update||{};const B=info.battery||{};
    if(B.percent!=null&&B.percent<30&&!B.plugged)return note('Charge PocketOS to 30% or plug it in first','bad');
    ask('Install version '+esc(u.available)+'?',esc(u.notes||'')+'<br><br>PocketOS downloads it, checks it, and restarts. It takes a minute or two. If the new version doesn’t start properly, it goes back to v'+esc(info.firmware)+' by itself.','Install',async()=>{const r=await api('/update/install',{body:{}});if(!r.ok)return note(r.msg,'bad');info.update=Object.assign({},u,{state:'downloading',progress:0});render();watchUpdate(u.available)})}
  else if(a==='pickimp')$('#imp').click();
  else if(a==='exp')exportCfg();
  else if(a==='forgetme')ask('Forget this phone?','You’ll need the code on PocketOS to connect again.','Forget',()=>{forgetToken();render()});
  else if(a==='unpairall')ask('Forget all phones?','Every phone and tablet, including this one, will need the code on PocketOS to connect again. Use this if a phone was lost or sold.','Forget all',async()=>{const r=await api('/unpair_all',{body:{}});if(r.ok){forgetToken();render();note('All phones forgotten','good')}else note(r.msg,'bad')},true);
  else if(a==='rest')ask('Restart '+esc(cfg.name)+'?','It will be back in about 20 seconds. Your settings stay as they are.','Restart',async()=>{const r=await api('/restart',{body:{}});if(r.ok){note('Restarting… back in about 20 seconds');setTimeout(()=>refreshInfo(),20000)}else note(r.msg,'bad')});
  else if(a==='newwifi')ask('Change Wi-Fi network?','PocketOS forgets its Wi-Fi and restarts into setup. Then join the <b>PocketOS</b> network shown on its screen and choose your new Wi-Fi. Your settings and devices are kept.','Change Wi-Fi',async()=>{const r=await api('/wifi/forget',{body:{}});if(r.ok)sheet('<h2>Restarting into setup</h2><p>On this phone, open Wi-Fi settings and join the <b>PocketOS</b> network shown on its screen (it also shows a code to scan). This page then opens by itself.</p><div class="btns"><button class="btn" data-a="x">OK</button></div>');else note(r.msg,'bad')},true);
  else if(a==='reset')ask('Reset everything?','This erases Wi-Fi, Home Assistant and every setting on '+esc(cfg.name)+', and returns it to first-time setup. You’ll confirm by pressing the Boot button on PocketOS.','Erase it',resetFlow,true);
  else if(a==='x')closeModal();
  else if(a==='go'){const f=ask.f;closeModal();f&&f()}
});
addEventListener('popstate',e=>{if(!info||!token||!cfg||wiz)return;closeModal();const t=(e.state&&e.state.tab)||'home';if(t!==tab)go(t,true)});
try{history.replaceState({tab:'home'},'')}catch(e){}
(()=>{let x0=null,y0=0;
  addEventListener('touchstart',e=>{const t=e.target;x0=(t.closest&&t.closest('input,select,textarea,.seg,.modal'))||tab==='home'?null:e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=Math.abs(t.clientY-y0);x0=null;
    if(dx>80&&dy<50&&!$('#modal').innerHTML){if(history.state&&history.state.tab===tab)history.back();else go('home')}},{passive:true});
})();
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.k;
  if(t.id==='fw'&&t.files[0]){uploadFw(t.files[0]);t.value='';return}
  if(t.id==='imp'&&t.files[0]){importCfg(t.files[0]);t.value='';return}
  if(t.dataset.a2==='showpw'){$('#wpw').type=t.checked?'text':'password';return}
  if(!k)return;
  if(k==='fav'&&t.dataset.id){setFlag(t.dataset.id,{fav:t.checked});return}
  if(k==='show'){setFlag(t.dataset.id,{hidden:!t.checked});return}
  if(k==='brightness'){save({brightness:+t.value});return}
  if(k==='tz'){save({tz:t.value},'Time zone saved ✓');return}
  if(k==='volume'){save({volume:+t.value});return}
  if(k==='speak'){const on=t.checked;save({speak:on},on?'Replies will be spoken ✓':'Replies will only be shown ✓');return}
  if(k==='auto_add'||k==='alerts'){const on=t.checked;save({[k]:on},k==='auto_add'?(on?'New devices will appear automatically ✓':'You’ll review new devices first ✓'):undefined);return}
  if(k==='ts'){const i=+t.dataset.i,on=t.checked;save({tiles:tilesWith(x=>{x[i].show=on})},on?'On the main menu ✓':'Moved under More ✓');return}
  if(k==='tn'){const i=+t.dataset.i,n=t.value.trim();if(!n||bytes(n)>12){note('Tile names are 1 to 12 characters','bad');t.value=cfg.tiles[i].label;return}if(n!==cfg.tiles[i].label)save({tiles:tilesWith(x=>{x[i].label=n})},'Tile renamed ✓')}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q')filter(t.value);
  if(t.dataset.k==='volume'){const l=$('#vl');if(l)l.textContent='Volume '+t.value+'%'}
  if(t.dataset.k==='brightness'){const l=$('#bl');if(l)l.textContent='Brightness '+t.value+'%';const p=$('#pv');if(p)p.style.filter='brightness('+(.4+t.value*.006).toFixed(2)+')'}
  if(t.id==='pin'){t.value=t.value.replace(/\D/g,'').slice(0,6);if(t.value.length===6)pair()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target;if(t.id==='pin')pair();else if(t.id==='wpw')join();else if(t.id==='nm')$('[data-a=name]').click();else if(t.dataset&&t.dataset.k==='tn')t.blur()}if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});

async function start(){
  if(!await loadInfo()){info=null;render();return}
  if(info.mode==='setup'){render();return}
  token=store.get(tokKey());
  if(token&&await loadCfg()){
    if(!info.paired)await loadInfo();   // before pairing PocketOS only shares its name
    if(!store.get(doneKey())&&info.ha.status==='not_set'&&!wiz)wiz='ha';
    if(info.ha.status!=='not_set')loadEnts();
  }
  render();
}
setInterval(async()=>{if(!info||info.mode==='setup'||!token||document.hidden)return;
  const before=JSON.stringify(info);await loadInfo();
  if(JSON.stringify(info)!==before&&canRerender()&&!wiz&&(tab==='home'||tab==='ha'||tab==='more'))render();else updHead();
  if(info.update&&info.update.state==='downloading'&&!updWatching)watchUpdate(info.update.available)},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)refreshInfo()});
start();
</script></body></html>
