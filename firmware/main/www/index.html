<title>PocketOS</title>
<style>
:root{--bg:#05060b;--ink:#f1f3ff;--dim:#8b91ae;--blue:#6aa7ff;--vio:#9b7bff;--glass:rgba(255,255,255,.065);--line:rgba(255,255,255,.14);--ok:#7be3a4;--warn:#ffd166;--bad:#ff7a8a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(60% 40% at 15% 0,rgba(106,167,255,.2),transparent 70%),radial-gradient(60% 40% at 95% 30%,rgba(155,123,255,.16),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{max-width:560px;margin:0 auto;padding:0 16px 120px}
a{color:var(--blue)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 2px 6px}
header .t{min-width:0}header b{font-size:22px;letter-spacing:-.02em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header span{font-size:13px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--glass);display:flex;gap:7px;align-items:center}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}.pill.bad::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}.pill.warn::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.edit{font-size:13px;color:var(--dim);margin:2px 2px 14px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.card h2{margin:0 0 4px;font-size:17px}.card p{margin:4px 0 10px;color:var(--dim);font-size:14px}.card p.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{padding:12px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);min-width:0}.st small{display:block;color:var(--dim);font-size:12px}.st b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st.bad b{color:var(--bad)}.st.warn b{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.row:first-child{border-top:0}.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t small{display:block;color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h3{margin:18px 4px 8px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 16px;font:600 15px system-ui,-apple-system,sans-serif;color:#fff;background:linear-gradient(135deg,var(--blue),var(--vio));box-shadow:0 6px 18px rgba(106,167,255,.28);text-decoration:none;cursor:pointer}
.btn.g{background:var(--glass);border:1px solid var(--line);box-shadow:none;color:var(--ink)}.btn.d{background:rgba(255,90,110,.18);border:1px solid rgba(255,90,110,.5);box-shadow:none;color:#ffb3bd}.btn.s{padding:9px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}

</style></head><body>
<div id="app"><div class="center"><p style="color:var(--dim)"><span class="spin"></span>Connecting to PocketOS…</p></div></div><div id="toast" role="status" aria-live="polite"></div><div id="modal"></div>
<script>
'use strict';
/* PocketOS settings website. Served by the device itself and talks only to it (API v2, docs/api.md).
   Nothing here contacts the internet. A setting is only shown as saved once PocketOS confirms it. */
const API='/api/v2';
const $=s=>document.querySelector(s),E=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=s=>new TextEncoder().encode(s).length;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

let info=null,cfg=null,ents=null,token=null,tab='home',wiz=null,reach=true,lastOk=0,entsLoading=false,batt=null,battAt=0,updWatching=false;
let setup={step:0,nets:null,scanning:false,pick:null,joined:null};

/* ---------- talking to PocketOS ---------- */
async function api(path,opt={}){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),opt.timeout||12000);
  const h={};if(token)h.Authorization='Bearer '+token;
  let body=opt.body;if(body!==undefined&&!(body instanceof Blob)&&!(body instanceof ArrayBuffer)){h['Content-Type']='application/json';body=JSON.stringify(body)}
  try{
    const r=await fetch(API+path,{method:opt.method||(body!==undefined?'POST':'GET'),headers:h,body,signal:ctl.signal,cache:'no-store'});
    let data=null;try{data=await r.json()}catch(e){}
    reach=true;lastOk=Date.now();
    if(r.status===401&&path!=='/pair'){forgetToken();render();return{ok:false,status:401,data,msg:'Pair this phone again with the code on PocketOS'}}
    return{ok:r.ok,status:r.status,data,msg:(data&&data.error)||('PocketOS answered '+r.status)};
  }catch(e){reach=false;return{ok:false,status:0,data:null,msg:'Couldn’t reach PocketOS. Nothing was changed.'}}
  finally{clearTimeout(tm)}
}
const tokKey=()=>'pocketos-token-'+(info?info.id:'');
function forgetToken(){token=null;store.del(tokKey())}

function note(m,kind){const t=$('#toast');t.textContent=m;t.className='show'+(kind?' '+kind:'');clearTimeout(note.t);note.t=setTimeout(()=>t.className='',kind==='bad'?4200:2600)}
/* Save a settings change. The page only updates once PocketOS sends back what it now has stored. */
async function save(patch,okMsg){
  note('Saving to '+(cfg?cfg.name:'PocketOS')+'…');
  const r=await api('/config',{body:patch});
  if(r.ok&&r.data&&r.data.name!==undefined){cfg=r.data;note(okMsg||'Saved on PocketOS ✓','good')}
  else note(r.msg,'bad');
  render();return r.ok;
}
async function setFlag(id,flags,okMsg){
  note('Saving…');
  const r=await api('/entities',{body:Object.assign({id},flags)});
  if(r.ok){const e=ents&&ents.entities.find(x=>x.id===id);if(e)Object.assign(e,flags.known?{new:false}:{},flags.fav!==undefined?{fav:flags.fav}:{},flags.hidden!==undefined?{hidden:flags.hidden}:{});note(okMsg||'Saved on PocketOS ✓','good');refreshInfo(true)}
  else note(r.msg,'bad');
  render();return r.ok;
}
async function loadInfo(){const r=await api('/info');if(r.ok&&r.data)info=r.data;return r.ok}
async function loadCfg(){const r=await api('/config');if(r.ok&&r.data)cfg=r.data;return r.ok}
async function loadEnts(){entsLoading=true;const r=await api('/entities');entsLoading=false;if(r.ok&&r.data)ents=r.data;return r.ok}
async function refreshInfo(quiet){const ok=await loadInfo();if(!quiet&&canRerender())render();else updHead();return ok}
function canRerender(){const a=document.activeElement;return !(a&&(a.matches('input,select,textarea')))&&!$('#modal').innerHTML}

/* ---------- little builders ---------- */
const sw=(attrs,on,label)=>'<label class="sw"><input type="checkbox" '+attrs+(on?' checked':'')+' aria-label="'+esc(label||'')+'"><i></i></label>';
const seg=(k,opts,v)=>'<div class="seg" role="group">'+opts.map(o=>'<button data-a="seg" data-k="'+k+'" data-v="'+esc(JSON.stringify(o[0]))+'" class="'+(o[0]===v?'on':'')+'" aria-pressed="'+(o[0]===v)+'">'+esc(o[1])+'</button>').join('')+'</div>';
const st=(l,v,cls)=>'<div class="st '+(cls||'')+'"><small>'+esc(l)+'</small><b>'+esc(v)+'</b></div>';
function ask(title,text,btn,fn,danger){$('#modal').innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="card"><h2>'+esc(title)+'</h2><p>'+text+'</p><div class="btns"><button class="btn g" data-a="x">Cancel</button><button class="btn '+(danger?'d':'')+'" data-a="go">'+esc(btn)+'</button></div></div></div>';ask.f=fn;setTimeout(()=>{const b=$('#modal [data-a=go]');b&&b.focus()},30)}
function sheet(html){$('#modal').innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="card">'+html+'</div></div>'}
const closeModal=()=>{$('#modal').innerHTML=''};
const signal=r=>r>=-55?'Strong':r>=-67?'Good':r>=-75?'Fair':'Weak';
const bars=r=>{const n=r>=-55?4:r>=-67?3:r>=-75?2:1;return '<span class="bars" aria-label="'+signal(r)+' signal">'+[5,8,11,14].map((h,i)=>'<i style="height:'+h+'px" class="'+(i<n?'on':'')+'"></i>').join('')+'</span>'};
function upFor(s){s=Math.round(s);if(s<90)return s+' s';if(s<5400)return Math.round(s/60)+' min';if(s<172800)return Math.round(s/3600)+' h';return Math.round(s/86400)+' days'}
const EYE={blue:'#6aa7ff',violet:'#9b7bff',white:'#e8ecff'};
const DOMAIN={light:'Light',switch:'Switch',climate:'Heating',media_player:'Media',fan:'Fan',cover:'Blind',lock:'Lock',sensor:'Sensor',binary_sensor:'Sensor',scene:'Scene',script:'Script'};
const TZ=[['GMT0BST,M3.5.0/1,M10.5.0','UK, Ireland, Portugal'],['CET-1CEST,M3.5.0,M10.5.0/3','Central Europe (Paris, Berlin, Madrid)'],['EET-2EEST,M3.5.0/3,M10.5.0/4','Eastern Europe (Athens, Helsinki)'],['EST5EDT,M3.2.0,M11.1.0','US Eastern'],['CST6CDT,M3.2.0,M11.1.0','US Central'],['MST7MDT,M3.2.0,M11.1.0','US Mountain'],['MST7','Arizona'],['PST8PDT,M3.2.0,M11.1.0','US Pacific'],['AKST9AKDT,M3.2.0,M11.1.0','Alaska'],['HST10','Hawaii'],['AEST-10AEDT,M10.1.0,M4.1.0/3','Sydney, Melbourne'],['AEST-10','Brisbane'],['ACST-9:30ACDT,M10.1.0,M4.1.0/3','Adelaide'],['AWST-8','Perth'],['NZST-12NZDT,M9.5.0,M4.1.0/3','New Zealand'],['IST-5:30','India'],['CST-8','China, Singapore'],['JST-9','Japan'],['UTC0','UTC']];
const TILE_HELP={favourites:'Your starred devices',lights:'All lights',heating:'Thermostats',media:'Speakers and TVs',locks:'Door locks',rooms:'Everything by room',scenes:'Scenes and scripts',plugs:'Smart plugs and switches',fans:'Fans',blinds:'Blinds and curtains',sensors:'Temperature and other readings'};
const haUrl=()=>(cfg&&cfg.ha_url)||'http://homeassistant.local:8123';
const safeHref=u=>/^https?:\/\//i.test(u)?u:'#';

/* ---------- header ---------- */
function headerHtml(){return '<header><div class="t"><b id="hn">'+esc(cfg?cfg.name:info.name)+'</b><span>'+esc(info.host||location.host)+' · on your home Wi-Fi</span></div><div class="pill" id="pill">Connected</div></header><div class="edit">You’re changing this PocketOS only.</div>'}
function updHead(){const p=$('#pill');if(!p)return;p.className='pill '+(reach?'':'bad');p.textContent=reach?'Connected':'Can’t reach'}

/* ---------- first-time setup (PocketOS's own network) ---------- */
function setupV(){
  const s=setup;let b;
  if(s.joined){const url='http://'+s.joined.host+'/';
    b='<h2>PocketOS is on your Wi-Fi ✓</h2><p>It’s restarting now. You won’t need PocketOS’s own network again.</p><ol class="how"><li>Your phone goes back to your home Wi-Fi by itself. If it doesn’t, choose <b>'+esc(s.pick)+'</b> in your phone’s Wi-Fi settings.</li><li>Wait for the companion to appear on PocketOS (about 20 seconds).</li><li>Open your settings page:</li></ol><div class="btns"><a class="btn" href="'+esc(url)+'">Open '+esc(s.joined.host)+'</a></div><p style="margin-top:12px">If that doesn’t open, tap the <b>Settings</b> tile on PocketOS and scan its code'+(s.joined.ip?', or use <a href="http://'+esc(s.joined.ip)+'/">'+esc(s.joined.ip)+'</a>':'')+'.</p>';
    return '<div class="center" style="text-align:left;padding-top:4vh"><div class="card">'+b+'</div></div>'}
  if(s.step===0)b='<div style="font-size:42px;text-align:center" aria-hidden="true">◉ ◉</div><h2 style="text-align:center">Let’s set up '+esc(info.name)+'</h2><p style="text-align:center">First, PocketOS joins your home Wi-Fi. It takes a minute, and nothing leaves your home.</p><div class="btns" style="justify-content:center"><button class="btn" data-a="sstep" data-v="1">Start</button></div>';
  else{
    let list;
    if(s.scanning)list='<p><span class="spin"></span>Looking for Wi-Fi networks…</p>';
    else if(!s.nets)list='';
    else if(!s.nets.length)list='<p>No networks found. Move closer to your router and try again.</p>';
    else list=s.nets.map(n=>'<button class="opt net '+(s.pick===n.ssid?'on':'')+'" data-a="pick" data-v="'+esc(n.ssid)+'"><b>'+esc(n.ssid)+'</b>'+(n.secure?'<span aria-label="Password protected">🔒</span>':'')+bars(n.rssi)+'</button>').join('');
    b='<h2>Choose your home Wi-Fi</h2><p>PocketOS uses 2.4 GHz Wi-Fi, which most routers provide alongside 5 GHz.</p>'+list+
      '<div class="btns"><button class="btn g s" data-a="scan">'+(s.nets?'Search again':'Search for networks')+'</button><button class="btn g s" data-a="manual">Type the name instead</button></div>'+
      '<div id="man" class="'+(s.manual?'':'hide')+'"><label class="f" for="ssid">Network name</label><input type="text" id="ssid" autocapitalize="off" autocorrect="off" maxlength="32" value="'+esc(s.manual&&s.pick||'')+'"></div>'+
      '<label class="f" for="wpw">Wi-Fi password</label><input type="password" id="wpw" maxlength="63" autocomplete="current-password"><label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--dim)"><input type="checkbox" data-a2="showpw"> Show password</label>'+
      '<div class="btns"><button class="btn" data-a="join" id="joinb">Connect</button></div><div id="werr" class="err"></div>';
  }
  return '<header><div class="t"><b>'+esc(info.name)+'</b><span>First-time setup</span></div></header><div class="stp"><i class="'+(s.step===0?'on':'')+'"></i><i class="'+(s.step===1?'on':'')+'"></i><i></i><i></i></div><div class="card">'+b+'</div>';
}
async function scan(){setup.scanning=true;render();const r=await api('/wifi/scan',{timeout:20000});setup.scanning=false;
  if(r.ok){const seen={};setup.nets=(r.data.networks||[]).filter(n=>n.ssid&&!seen[n.ssid]&&(seen[n.ssid]=1)).sort((a,b)=>b.rssi-a.rssi)}else{setup.nets=[];note(r.msg,'bad')}render()}
async function join(){
  const ssid=setup.manual?$('#ssid').value.trim():setup.pick,pw=$('#wpw').value,er=$('#werr');
  if(!ssid){er.textContent='Choose your network first.';return}
  const n=setup.nets&&setup.nets.find(x=>x.ssid===ssid);
  if(n&&n.secure&&!pw){er.textContent='Enter the Wi-Fi password.';return}
  if(pw&&pw.length<8){er.textContent='Wi-Fi passwords are at least 8 characters.';return}
  er.textContent='';const b=$('#joinb');b.disabled=true;b.innerHTML='<span class="spin"></span>Joining…';
  const r=await api('/wifi',{body:{ssid,password:pw},timeout:40000});
  if(r.ok){setup.pick=ssid;setup.joined={host:r.data.host||(info.host||''),ip:r.data.ip||''};render()}
  else{b.disabled=false;b.textContent='Connect';$('#werr').textContent=r.msg}
}

/* ---------- pairing ---------- */
function pairV(){return '<div class="center"><div class="card"><div style="font-size:38px" aria-hidden="true">◉ ◉</div><h1>Connect to '+esc(info.name)+'</h1><p>Enter the 6-digit code on the PocketOS screen.</p><p style="font-size:13px">Can’t see a code? Press the <b>BOOT</b> button on its side.</p><input class="pin" id="pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" aria-label="6-digit code"><div id="perr" class="err"></div><div class="btns" style="justify-content:center"><button class="btn" data-a="pair">Connect</button></div><p style="margin-top:14px;font-size:13px">You do this once on each phone or tablet.</p></div></div>'}
async function pair(){
  const v=($('#pin').value||'').replace(/\D/g,''),er=$('#perr');
  if(v.length!==6){er.textContent='The code has 6 digits.';return}
  er.textContent='';const r=await api('/pair',{body:{pin:v}});
  if(r.ok&&r.data&&r.data.token){token=r.data.token;store.set(tokKey(),token);await start();note('This phone is connected ✓','good')}
  else{er.textContent=r.msg;$('#pin').value='';$('#pin').focus()}
}

/* ---------- guided setup after pairing (Home Assistant) ---------- */
const doneKey=()=>'pocketos-setup-'+info.id;
function wizV(){
  const z=wiz;let b;
  if(z==='ha')b='<h2>Do you use Home Assistant?</h2><p>It’s a free app that links smart-home brands together so PocketOS can control them. Alexa, Google Home or Apple Home on their own aren’t Home Assistant.</p><button class="opt" data-a="wz" data-v="connect"><b>Yes, I use it</b><small>Connect it now</small></button><button class="opt" data-a="wz" data-v="none"><b>No, or I’m not sure</b><small>See what you’d need</small></button>';
  else if(z==='none')b='<h2>Getting Home Assistant</h2><p>It runs at home, for example on a Home Assistant Green box, a Raspberry Pi or a spare PC. Your smart devices are then added inside it.</p><div class="btns"><a class="btn" href="https://www.home-assistant.io/installation/" target="_blank" rel="noopener noreferrer">How to install ↗</a><button class="btn g" data-a="wz" data-v="ha">Back</button></div><p style="margin-top:12px">Without it, PocketOS still shows its companion, clock and moods. You can connect it any time from the <b>Smart home</b> tab.</p><div class="btns"><button class="btn g" data-a="wz" data-v="done">Finish for now</button></div>';
  else if(z==='connect')b='<h2>Connect Home Assistant</h2><p>PocketOS gets its own login, so your main account stays private.</p>'+guideHtml()+'<label class="f" for="wurl">Home Assistant address</label><input type="url" id="wurl" value="'+esc(haUrl())+'" autocapitalize="off" autocorrect="off"><label class="f" for="wtok">Token</label><input type="password" id="wtok" placeholder="Paste token" autocomplete="off"><div class="btns"><button class="btn" data-a="wizha" id="wizb">Test and connect</button><button class="btn g" data-a="wz" data-v="ha">Back</button></div><div id="wmsg" class="err"></div>';
  else if(z==='fav'){const list=ents?ents.entities.filter(e=>!e.hidden&&e.domain!=='sensor'&&e.domain!=='binary_sensor'):[];
    b='<h2>Pick your favourites</h2><p>Favourites get the first tile on PocketOS. You can change these any time in <b>Devices</b>.</p>'+(list.length?'<div>'+list.map(e=>'<div class="row"><div class="t"><b>'+esc(e.name)+'</b><small>'+esc(e.area||'No room')+' · '+esc(DOMAIN[e.domain]||e.domain)+'</small></div>'+sw('data-k="fav" data-id="'+esc(e.id)+'"',e.fav,'Favourite '+e.name)+'</div>').join('')+'</div>':'<p>'+(entsLoading?'<span class="spin"></span>Loading your devices…':'No devices yet. Add them in Home Assistant and they’ll appear here.')+'</p>')+'<div class="btns"><button class="btn" data-a="wz" data-v="done">Finish</button></div>'}
  else b='<h2>All set</h2><p>'+(info.ha.status==='connected'?'PocketOS now shows your rooms, devices and scenes.':'PocketOS is ready with its companion and clock. Connect Home Assistant any time from the Smart home tab.')+'</p><p>Tip: tap the <b>Settings</b> tile on PocketOS any time to get back here.</p><div class="btns"><button class="btn" data-a="wzend">Go to my dashboard</button></div>';
  const p={ha:0,none:1,connect:1,fav:2,done:3}[z];

/* Test, save, then wait until PocketOS itself reports it's connected. */
async function connectHA(url,tok,msgEl,btn){
  const set=(t,ok)=>{msgEl.className=ok?'okm':'err';msgEl.innerHTML=t};
  url=url.trim().replace(/\/+$/,'');
  if(!/^https?:\/\/[^\s/]+/i.test(url)){set('The address should look like http://homeassistant.local:8123');return false}
  if(!tok&&!(cfg&&cfg.ha_token_set)){set('Paste the token first.');return false}
  const lbl=btn&&btn.textContent;if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>Testing…'}
  const done=ok=>{if(btn){btn.disabled=false;btn.textContent=lbl}return ok};
  const t=await api('/ha/test',{body:{url,token:tok},timeout:20000});
  if(!t.ok){set(esc(t.msg));return done(false)}
  if(btn)btn.innerHTML='<span class="spin"></span>Connecting…';
  const r=await api('/ha',{body:{url,token:tok}});
  if(!r.ok){set(esc(r.msg));return done(false)}
  await loadCfg();
  for(let i=0;i<15;i++){await new Promise(z=>setTimeout(z,1500));await loadInfo();
    if(info.ha.status==='connected'){set('Connected ✓ PocketOS can see '+info.ha.devices+' devices.',true);await loadEnts();return done(true)}
    if(info.ha.status==='error'){set(esc(info.ha.error||'Home Assistant refused the connection.'));return done(false)}}
  set('Saved, but PocketOS hasn’t connected yet. Check the address and that Home Assistant is running.');return done(false);
}


/* ---------- battery ---------- */
async function loadBatt(){const r=await api('/battery');if(r.ok&&r.data){batt=r.data;battAt=Date.now()}return r.ok}
const hrs=h=>h<1?'under an hour':h<36?Math.round(h)+' hours':(Math.round(h/2.4)/10)+' days';
function ago(ts){const s=Math.max(0,Date.now()/1000-ts);if(s<90)return 'just now';if(s<5400)return Math.round(s/60)+' minutes ago';if(s<129600)return Math.round(s/3600)+' hours ago';return Math.round(s/86400)+' days ago'}
function battChart(b){
  const now=b.now||Date.now()/1000,t0=now-48*3600,H=b.history.filter(r=>r[0]>=t0);
  if(H.length<2)return '<p style="font-size:13px">The chart fills in over the next few hours.</p>';
  const W=320,Ht=112,L=30,T=6,B=20,x=t=>L+(t-t0)/(now-t0)*(W-L-4),y=p=>T+(100-p)/100*(Ht-T-B);
  let shade='',line='',d='';
  for(let i=0;i<H.length;i++){const r=H[i],gap=i&&r[0]-H[i-1][0]>7200;
    d+=(i===0||gap?'M':'L')+x(r[0]).toFixed(1)+' '+y(r[1]).toFixed(1);
    if(r[3]&2){const e=i<H.length-1?H[i+1][0]:now;shade+='<rect x="'+x(r[0]).toFixed(1)+'" y="'+T+'" width="'+Math.max(1,x(e)-x(r[0])).toFixed(1)+'" height="'+(Ht-T-B)+'" fill="rgba(123,227,164,.13)"/>'}}
  const grid=[0,50,100].map(p=>'<line x1="'+L+'" x2="'+(W-4)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="rgba(255,255,255,.08)"/><text x="'+(L-6)+'" y="'+(y(p)+4)+'" text-anchor="end" font-size="10" fill="#8b91ae">'+p+'%</text>').join('');
  const xl=[[t0,'48 h ago','start'],[now-24*3600,'24 h','middle'],[now,'now','end']].map(a=>'<text x="'+x(a[0])+'" y="'+(Ht-5)+'" text-anchor="'+a[2]+'" font-size="10" fill="#8b91ae">'+a[1]+'</text>').join('');
  line='<path d="'+d+'" fill="none" stroke="#6aa7ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="Battery level over the last 48 hours" style="display:block;margin-top:8px">'+grid+shade+line+xl+'</svg><p style="font-size:12px;margin:2px 0 0"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(123,227,164,.35);vertical-align:-1px"></span> Plugged in</p>';
}
function battCard(){
  if(Date.now()-battAt>55000)loadBatt().then(()=>{if(tab==='home'&&canRerender()&&!wiz)render()});
  const b=batt;
  if(!b)return '<div class="card"><h2>Battery</h2><p><span class="spin"></span>Reading the battery…</p></div>';
  if(!b.present)return '<div class="card"><h2>Battery</h2><p>No battery found. PocketOS is running from USB power.</p></div>';
  const e=b.estimate||{},state=b.charging?'Charging':b.plugged?(b.full||b.percent>=100?'Plugged in · full':'Plugged in'):'On battery';
  let est=e.known&&e.hours_left!=null?'About <b>'+hrs(e.hours_left)+'</b> left, going by how you’ve used it lately.':e.known?'A full charge lasts about <b>'+hrs(e.full_h)+'</b> with your use.':'Still learning how long a charge lasts. Check back after a few hours off the charger.';
  return '<div class="card"><h2>Battery</h2><div style="display:flex;align-items:baseline;gap:10px"><b style="font-size:34px;letter-spacing:-.02em">'+(b.percent!=null?b.percent+'%':'—')+'</b><span style="color:var(--dim);font-size:14px">'+state+(b.mv?' · '+(b.mv/1000).toFixed(2)+' V':'')+'</span></div><p style="margin-top:6px">'+est+(e.known?' <span style="font-size:12px">(from '+Math.round(e.basis_h)+' h of readings)</span>':'')+'</p>'+battChart(b)+(b.last_full?'<p style="font-size:13px;margin-top:8px">Last fully charged '+ago(b.last_full)+'.</p>':'')+'</div>';
}

function updBanner(){const u=info.update;if(!u||!u.available||(u.state!=='available'&&u.state!=='downloading'))return '';

function updCard(){
  const u=info.update||{};let s;

async function watchUpdate(target){
  if(updWatching)return;updWatching=true;const t0=Date.now();let gone=false;
  while(Date.now()-t0<240000){await new Promise(z=>setTimeout(z,1500));
    const ok=await loadInfo();
    if(!ok){if(!gone){gone=true;sheet('<h2><span class="spin"></span>Installing</h2><p>PocketOS is restarting into version '+esc(target)+'. This page reconnects by itself.</p>')}continue}
    if(info.firmware===target){closeModal();updWatching=false;batt=null;battAt=0;render();note('Now running v'+target+' ✓','good');return}
    if(gone){closeModal();updWatching=false;render();note('PocketOS restarted on v'+info.firmware+'. The new version didn’t start properly, so it went back by itself.','bad');return}
    const u=info.update||{};
    if(u.state!=='downloading'&&u.state!=='installed'){updWatching=false;if(canRerender())render();if(u.error)note('Update failed: '+u.error+'. Nothing changed.','bad');return}
    if(canRerender()&&(tab==='home'||tab==='more'))render()}
  updWatching=false;closeModal();note('PocketOS hasn’t come back yet. Check its screen, then reload this page.','bad');
}
async function checkUpdate(){
  const r=await api('/update/check',{body:{}});if(!r.ok)return note(r.msg,'bad');
  info.update=Object.assign({},info.update,{state:'checking'});render();
  for(let i=0;i<40;i++){await new Promise(z=>setTimeout(z,1000));await loadInfo();if(info.update&&info.update.state!=='checking')break}
  render();const u=info.update||{};note(u.available?'Version '+u.available+' is ready':u.state==='latest'?'PocketOS is up to date':'Couldn’t check: '+(u.error||'no answer'),u.available||u.state==='latest'?'good':'bad');
}

   '<div class="btns"><button class="btn" data-a="conn" id="connb">'+(h.status==='connected'?'Save and reconnect':'Test and connect')+'</button>'+(c.ha_token_set?'<button class="btn d" data-a="disc">Disconnect</button>':'')+'</div><div id="hmsg"></div></div>'+
  '<div class="card"><h2>Need help connecting?</h2><p>New to Home Assistant? We’ll walk you through it step by step.</p><div class="btns"><button class="btn g" data-a="wz" data-v="connect">Guide me</button><button class="btn g" data-a="wz" data-v="none">I don’t have Home Assistant</button></div></div>'+
  '<div class="card"><div class="row"><div class="t"><b style="white-space:normal">Add new devices automatically</b><small style="white-space:normal">When you add something in Home Assistant, PocketOS shows it straight away. Turn off to review each one first.</small></div>'+sw('data-k="auto_add"',c.auto_add,'Add new devices automatically')+'</div></div>'+
  '<div class="card"><h2>Add more smart devices</h2><p>New lights, plugs and speakers are added inside Home Assistant, on your home Wi-Fi. PocketOS picks them up by itself.</p><div class="btns"><a class="btn g" href="'+esc(safeHref(haUrl()))+'/config/integrations" target="_blank" rel="noopener noreferrer">Open Home Assistant ↗</a><button class="btn" data-a="find">Check for new devices</button></div></div>'+
  '<div class="card"><h2>Voice</h2><p>Hold <b>BOOT</b> and speak, then let go. This uses the voice assistant set up in Home Assistant (Settings → Voice assistants), so what you say goes to your Home Assistant, not to PocketOS’s makers.</p></div>';
}
function moreV(){
  return '<div class="card"><h2>This PocketOS</h2><div class="grid">'+st('Name',cfg.name)+st('Device ID',info.id)+st('Firmware','v'+info.firmware)+st('Address',info.host||'—')+st('IP address',info.wifi.ip||'—')+st('Wi-Fi',info.wifi.ssid||'—')+'</div><p style="margin-top:12px">Each PocketOS has its own address and keeps its own settings. If you have two, add each one to your Home Screen.</p></div>'+
  updCard()+'<div class="card"><h2>Install from a file</h2><p>For testing a build yourself: choose a <b>pocketos.bin</b> file. PocketOS checks it, and if it doesn’t start properly it goes back to the current version by itself.</p><input type="file" id="fw" accept=".bin,application/octet-stream" class="hide"><div class="btns"><button class="btn g" data-a="pickfw">Choose file…</button></div><div id="fwm"></div></div>'+
  '<div class="card"><h2>Back up settings</h2><p>Save your look, tiles and device choices to a file. It doesn’t include Wi-Fi or Home Assistant passwords or tokens.</p><input type="file" id="imp" accept=".json,application/json" class="hide"><div class="btns"><button class="btn g" data-a="exp">Download backup</button><button class="btn g" data-a="pickimp">Restore from file…</button></div></div>'+
  '<div class="card"><h2>Side buttons</h2>'+buttonsHtml()+'</div>'+
  '<div class="card"><h2>Phones and tablets</h2><p>Paired phones stay connected, even after a restart.</p><div class="btns"><button class="btn g" data-a="forgetme">Forget this phone</button><button class="btn g" data-a="unpairall">Forget all phones</button></div></div>'+
  '<div class="card"><h2>Maintenance</h2><div class="btns"><button class="btn g" data-a="wz" data-v="ha">Run the setup guide</button><button class="btn g" data-a="rest">Restart</button><button class="btn g" data-a="newwifi">Change Wi-Fi network</button><button class="btn d" data-a="reset">Reset everything</button></div></div>'+
  '<p class="edit">PocketOS keeps everything on the device and your home network. There’s no account, cloud, advertising or tracking.</p>';
}
function buttonsHtml(){return '<div class="row"><div class="t"><b>BOOT, press</b><small>Show the Settings code (or wake the screen)</small></div></div><div class="row"><div class="t"><b>BOOT, press twice</b><small>Back to the companion</small></div></div><div class="row"><div class="t"><b>BOOT, hold</b><small>Talk to Home Assistant, let go when done</small></div></div><div class="row"><div class="t"><b>PWR, press</b><small>Screen off or on</small></div></div><div class="row"><div class="t"><b>PWR, hold</b><small>Keep holding to switch off</small></div></div>'}

const TABS=[['home','Home'],['dev','Devices'],['look','Look'],['ha','Smart home'],['more','More']];
function render(){
  if(!info){E.innerHTML='<div class="center"><div class="card"><h1>Can’t reach PocketOS</h1><p>Make sure this phone is on the same Wi-Fi as PocketOS, and that PocketOS is switched on.</p><div class="btns" style="justify-content:center"><button class="btn" data-a="retry">Try again</button></div></div></div>';return}
  if(info.mode==='setup'){E.innerHTML=setupV();return}
  if(!token){E.innerHTML=pairV();setTimeout(()=>{const p=$('#pin');p&&p.focus()},50);return}
  if(!cfg){E.innerHTML='<div class="center"><p><span class="spin"></span>Loading…</p></div>';return}
  if(wiz){E.innerHTML=wizV();return}
  const v={home:homeV,dev:devV,look:lookV,ha:haV,more:moreV}[tab]();
  const sy=scrollY,q=$('#q')&&$('#q').value;
  E.innerHTML=headerHtml()+'<main>'+v+'</main><nav aria-label="Sections">'+TABS.map(t=>'<button data-a="tab" data-v="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'" '+(tab===t[0]?'aria-current="page"':'')+'>'+t[1]+(t[0]==='dev'&&info.ha.new>0&&!cfg.auto_add?' <em>•</em>':'')+'</button>').join('')+'</nav>';
  updHead();if(q&&$('#q')){$('#q').value=q;filter(q)}scrollTo(0,sy);
}
function filter(q){q=q.trim().toLowerCase();let any=false;document.querySelectorAll('.grp').forEach(g=>{let n=0;g.querySelectorAll('.row').forEach(r=>{const m=!q||r.dataset.n.includes(q);r.classList.toggle('hide',!m);if(m)n++});g.classList.toggle('hide',!n);if(n)any=true});const nq=$('#noq');nq&&nq.classList.toggle('hide',any)}
function go(t){tab=t;render();scrollTo(0,0);refreshInfo(true);if(t==='dev'&&info.ha.status!=='not_set'){loadEnts().then(()=>{if(tab==='dev')render()});if(!ents)render()}}

/* ---------- actions ---------- */
function tilesWith(fn){const t=cfg.tiles.map(x=>({key:x.key,label:x.label,show:x.show}));fn(t);return t}
async function uploadFw(f){
  const m=$('#fwm');m.className='';
  const head=new Uint8Array(await f.slice(0,112).arrayBuffer()),dv=new DataView(head.buffer);
  const str=(a,b)=>new TextDecoder().decode(head.slice(a,b)).replace(/\0.*$/s,'');
  if(head.length<112||head[0]!==0xE9||dv.getUint32(32,true)!==0xABCD5432){m.className='err';m.textContent=f.name.includes('full')?'That’s the full-flash file for a computer. Choose pocketos.bin instead.':'That isn’t a PocketOS firmware file.';return}
  const ver=str(48,80),proj=str(80,112);
  if(proj!=='pocketos'){m.className='err';m.textContent='That firmware is for “'+proj+'”, not PocketOS.';return}
  if(f.size>6*1024*1024){m.className='err';m.textContent='That file is too big for PocketOS.';return}
  ask('Install version '+ver+'?','You’re on v'+esc(info.firmware)+'. PocketOS restarts when it’s done, which takes about a minute. Keep this page open and PocketOS charging.','Install',()=>{
    m.innerHTML='<p>Sending update…</p><div class="bar"><i id="fwb"></i></div>';
    const x=new XMLHttpRequest();x.open('POST',API+'/ota');x.setRequestHeader('Authorization','Bearer '+token);x.setRequestHeader('Content-Type','application/octet-stream');x.timeout=180000;
    x.upload.onprogress=e=>{if(e.lengthComputable)$('#fwb').style.width=Math.round(e.loaded/e.total*100)+'%'};
    x.onload=async()=>{let d={};try{d=JSON.parse(x.responseText)}catch(e){}
      if(x.status!==200){m.className='err';m.textContent=d.error||'Update failed. PocketOS is still on the old version.';return}
      m.innerHTML='<p><span class="spin"></span>Installed. Waiting for PocketOS to restart…</p>';
      const t0=Date.now();await new Promise(z=>setTimeout(z,5000));
      while(Date.now()-t0<120000){if(await loadInfo()&&info.firmware){if(info.firmware===ver){render();const n=$('#fwm');if(n)n.innerHTML='<p class="okm">Now running v'+esc(ver)+' ✓</p>';note('Updated to v'+ver+' ✓','good');return}else{m.className='err';m.textContent='PocketOS restarted on v'+info.firmware+'. The new version didn’t start properly, so it went back automatically.';return}}await new Promise(z=>setTimeout(z,3000))}
      m.className='err';m.textContent='PocketOS hasn’t come back yet. Check its screen, then reload this page.'};
    x.onerror=x.ontimeout=()=>{m.className='err';m.textContent='The upload stopped. PocketOS is still on the old version.'};
    x.send(f)});
}
async function exportCfg(){
  const r=await api('/export');if(!r.ok)return note(r.msg,'bad');
  const blob=new Blob([JSON.stringify(r.data,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=(cfg.name.replace(/[^\w-]+/g,'-')||'pocketos')+'-settings.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);note('Backup downloaded ✓','good');
}
async function importCfg(f){
  let j;try{j=JSON.parse(await f.text())}catch(e){return note('That file isn’t a PocketOS backup.','bad')}
  if(!j||typeof j!=='object'||Array.isArray(j)||j.name===undefined||!Array.isArray(j.tiles))return note('That file isn’t a PocketOS backup.','bad');
  ['ha_url','ha_token','ha_token_set','schema'].forEach(k=>delete j[k]);   // connection details are never restored from a file
  ask('Restore “'+esc(j.name)+'”?','This replaces the look, tiles and device choices on '+esc(cfg.name)+'. Wi-Fi and Home Assistant stay as they are.','Restore',()=>save(j,'Settings restored ✓'));
}
async function resetFlow(){
  const r=await api('/reset',{body:{}});if(!r.ok)return note(r.msg,'bad');
  let left=15;
  const draw=()=>sheet('<h2>Confirm on PocketOS</h2><p>To erase it, press the <b>BOOT</b> button on the side of PocketOS now.</p><p style="font-size:28px;font-weight:700;margin:6px 0">'+left+' s</p><p>If you don’t, nothing is erased.</p>');
  draw();
  const iv=setInterval(async()=>{left--;
    const alive=await loadInfo();
    if(!alive){clearInterval(iv);forgetToken();sheet('<h2>PocketOS was reset</h2><p>It’s restarting into first-time setup. Join the <b>PocketOS</b> Wi-Fi network shown on its screen to set it up again.</p><div class="btns"><button class="btn" data-a="x">OK</button></div>');return}
    if(left<=0){clearInterval(iv);sheet('<h2>Reset cancelled</h2><p>BOOT wasn’t pressed, so nothing was erased.</p><div class="btns"><button class="btn" data-a="x">OK</button></div>');return}
    draw()},1000);
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
  if(a==='tab')go(v);
  else if(a==='retry'){await start()}
  else if(a==='sstep'){setup.step=+v;render();if(setup.step===1&&!setup.nets)scan()}
  else if(a==='scan')scan();
  else if(a==='pick'){setup.pick=v;setup.manual=false;render();const p=$('#wpw');p&&p.focus()}
  else if(a==='manual'){setup.manual=true;setup.pick='';render();$('#ssid').focus()}
  else if(a==='join')join();
  else if(a==='pair')pair();
  else if(a==='wz'){wiz=v;if(v==='fav'&&!ents){loadEnts().then(render)}render();scrollTo(0,0)}
  else if(a==='wzend'){wiz=null;store.set(doneKey(),'1');tab='home';render();scrollTo(0,0)}
  else if(a==='wizha'){if(await connectHA($('#wurl').value,$('#wtok').value,$('#wmsg'),$('#wizb'))){await loadEnts();wiz='fav';render();scrollTo(0,0)}}
  else if(a==='tip'){store.set('pocketos-tip-a2hs','1');render()}
  else if(a==='buttons')sheet('<h2>Side buttons</h2>'+buttonsHtml()+'<div class="btns"><button class="btn" data-a="x">Done</button></div>');
  else if(a==='seg'){const k=b.dataset.k,val=JSON.parse(v);if(cfg[k]!==val)save({[k]:val})}
  else if(a==='name'){const n=$('#nm').value.trim();if(!n||bytes(n)>24)return note('Names are 1 to 24 characters','bad');if(n!==cfg.name)save({name:n},'Name saved on PocketOS ✓')}
  else if(a==='mv'){const i=+b.dataset.i,j=i+(+v);save({tiles:tilesWith(t=>{[t[i],t[j]]=[t[j],t[i]]})},'Menu order saved ✓')}
  else if(a==='defl')ask('Restore look to default?','Clock, brightness, sleep and companion go back to normal. Tiles, devices and Home Assistant stay as they are.','Restore',()=>save({brightness:80,clock_24h:true,date_format:'dmy',sleep_s:30,eye:'blue',anim:'lively',alerts:true},'Look restored ✓'));
  else if(a==='fav')setFlag(id,{fav:!b.classList.contains('on')});
  else if(a==='add')setFlag(id,{known:true,hidden:false},'Added to PocketOS ✓');
  else if(a==='skip')setFlag(id,{known:true,hidden:true},'Skipped. You can still show it later.');
  else if(a==='addall'){note('Saving…');const r=await api('/entities',{body:{all_known:true}});if(r.ok){ents.entities.forEach(x=>x.new=false);await loadInfo();note('All added ✓','good')}else note(r.msg,'bad');render()}
  else if(a==='reload'){ents=ents||null;entsLoading=true;render();await loadEnts();await loadInfo();render()}
  else if(a==='conn')connectHA($('#url').value,$('#tok').value,$('#hmsg'),$('#connb')).then(ok=>{if(ok)setTimeout(render,1500)});
  else if(a==='disc')ask('Disconnect Home Assistant?','PocketOS stops controlling your home and forgets the token. You can reconnect any time.','Disconnect',async()=>{note('Disconnecting…');const r=await api('/ha/disconnect',{body:{}});if(r.ok){await loadCfg();await loadInfo();ents=null;note('Disconnected','good')}else note(r.msg,'bad');render()},true);
  else if(a==='find'){note('Checking…');await loadInfo();await loadEnts();const n=info.ha.new;note(n?n+' new device'+(n>1?'s':'')+' found':cfg.auto_add?'Up to date. New devices appear by themselves.':'No new devices','good');if(n)go('dev');else render()}
  else if(a==='pickfw')$('#fw').click();
  else if(a==='updcheck')checkUpdate();
  else if(a==='updinstall'){const u=info.update||{};const B=info.battery||{};
    if(B.percent!=null&&B.percent<30&&!B.plugged)return note('Charge PocketOS to 30% or plug it in first','bad');
    ask('Install version '+esc(u.available)+'?',esc(u.notes||'')+'<br><br>PocketOS downloads it, checks it, and restarts. It takes a minute or two. If the new version doesn’t start properly, it goes back to v'+esc(info.firmware)+' by itself.','Install',async()=>{const r=await api('/update/install',{body:{}});if(!r.ok)return note(r.msg,'bad');info.update=Object.assign({},u,{state:'downloading',progress:0});render();watchUpdate(u.available)})}
  else if(a==='pickimp')$('#imp').click();
  else if(a==='exp')exportCfg();
  else if(a==='forgetme')ask('Forget this phone?','You’ll need the code on PocketOS to connect again.','Forget',()=>{forgetToken();render()});
  else if(a==='unpairall')ask('Forget all phones?','Every phone and tablet, including this one, will need the code on PocketOS to connect again. Use this if a phone was lost or sold.','Forget all',async()=>{const r=await api('/unpair_all',{body:{}});if(r.ok){forgetToken();render();note('All phones forgotten','good')}else note(r.msg,'bad')},true);
  else if(a==='rest')ask('Restart '+esc(cfg.name)+'?','It will be back in about 20 seconds. Your settings stay as they are.','Restart',async()=>{const r=await api('/restart',{body:{}});if(r.ok){note('Restarting… back in about 20 seconds');setTimeout(()=>refreshInfo(),20000)}else note(r.msg,'bad')});
  else if(a==='newwifi')ask('Change Wi-Fi network?','PocketOS forgets its Wi-Fi and restarts into setup. Then join the <b>PocketOS</b> network shown on its screen and choose your new Wi-Fi. Your settings and devices are kept.','Change Wi-Fi',async()=>{const r=await api('/wifi/forget',{body:{}});if(r.ok)sheet('<h2>Restarting into setup</h2><p>On this phone, open Wi-Fi settings and join the <b>PocketOS</b> network shown on its screen (it also shows a code to scan). This page then opens by itself.</p><div class="btns"><button class="btn" data-a="x">OK</button></div>');else note(r.msg,'bad')},true);
  else if(a==='reset')ask('Reset everything?','This erases Wi-Fi, Home Assistant and every setting on '+esc(cfg.name)+', and returns it to first-time setup. You’ll confirm with the BOOT button on the device.','Erase it',resetFlow,true);
  else if(a==='x')closeModal();
  else if(a==='go'){const f=ask.f;closeModal();f&&f()}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.k;
  if(t.id==='fw'&&t.files[0]){uploadFw(t.files[0]);t.value='';return}
  if(t.id==='imp'&&t.files[0]){importCfg(t.files[0]);t.value='';return}
  if(t.dataset.a2==='showpw'){$('#wpw').type=t.checked?'text':'password';return}
  if(!k)return;
  if(k==='fav'&&t.dataset.id){setFlag(t.dataset.id,{fav:t.checked});return}
  if(k==='show'){setFlag(t.dataset.id,{hidden:!t.checked});return}
  if(k==='brightness'){save({brightness:+t.value});return}
  if(k==='tz'){save({tz:t.value},'Time zone saved ✓');return}
  if(k==='auto_add'||k==='alerts'){const on=t.checked;save({[k]:on},k==='auto_add'?(on?'New devices will appear automatically ✓':'You’ll review new devices first ✓'):undefined);return}
  if(k==='ts'){const i=+t.dataset.i,on=t.checked;save({tiles:tilesWith(x=>{x[i].show=on})},on?'On the main menu ✓':'Moved under More ✓');return}
  if(k==='tn'){const i=+t.dataset.i,n=t.value.trim();if(!n||bytes(n)>12){note('Tile names are 1 to 12 characters','bad');t.value=cfg.tiles[i].label;return}if(n!==cfg.tiles[i].label)save({tiles:tilesWith(x=>{x[i].label=n})},'Tile renamed ✓')}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q')filter(t.value);
  if(t.dataset.k==='brightness'){const l=$('#bl');if(l)l.textContent='Brightness '+t.value+'%';const p=$('#pv');if(p)p.style.filter='brightness('+(.4+t.value*.006).toFixed(2)+')'}
  if(t.id==='pin'){t.value=t.value.replace(/\D/g,'').slice(0,6);if(t.value.length===6)pair()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target;if(t.id==='pin')pair();else if(t.id==='wpw')join();else if(t.id==='nm')$('[data-a=name]').click();else if(t.dataset&&t.dataset.k==='tn')t.blur()}if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});

async function start(){
  if(!await loadInfo()){info=null;render();return}
  if(info.mode==='setup'){render();return}
  token=store.get(tokKey());
  if(token&&await loadCfg()){
    if(!store.get(doneKey())&&info.ha.status==='not_set'&&!wiz)wiz='ha';
    if(info.ha.status!=='not_set')loadEnts();
  }
  render();
}
setInterval(async()=>{if(!info||info.mode==='setup'||!token||document.hidden)return;
  const before=JSON.stringify(info);await loadInfo();
  if(JSON.stringify(info)!==before&&canRerender()&&!wiz&&(tab==='home'||tab==='ha'||tab==='more'))render();else updHead();
  if(info.update&&info.update.state==='downloading'&&!updWatching)watchUpdate(info.update.available)},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)refreshInfo()});
start();
</script></body></html>
