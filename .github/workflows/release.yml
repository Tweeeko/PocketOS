# PocketOS, created by Leeko. Copyright (c) 2026 Leeko.
name: Release

# Publishes a firmware update that every PocketOS can find and install.
# Run it from the Actions tab (Release → Run workflow) after bumping firmware/version.txt and
# adding a CHANGELOG.md entry. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: "Share of devices offered it automatically at first (1-100). Raise it later with the Rollout workflow."
        default: "100"
        required: true

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core unit tests
        run: make -C firmware/host test

  release:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and release notes
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d ' \r\n' < firmware/version.txt)
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::firmware/version.txt must look like 1.2.3"; exit 1; }
          if gh release view "v$VER" >/dev/null 2>&1; then echo "::error::v$VER is already released. Bump firmware/version.txt first."; exit 1; fi
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d' > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## $VER' section"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # Releases built here look for updates in this repository's releases
          echo "CONFIG_POCKETOS_UPDATE_URL=\"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json\"" > firmware/sdkconfig.release

      - name: Build with ESP-IDF 5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          path: firmware
          command: (idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build || (cd build && ninja -k 0; exit 1)) && idf.py merge-bin -o pocketos-full.bin   # on failure, list every error, not just the first

      - name: Check the build, sign it and write manifest.json
        env:
          SIGNING_KEY: ${{ secrets.POCKETOS_SIGNING_KEY }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          VER=${{ steps.v.outputs.version }}
          mkdir out
          sudo cp firmware/build/pocketos.bin out/pocketos.bin
          FULL=$(sudo find firmware -name pocketos-full.bin | head -1)
          sudo cp "$FULL" out/pocketos-full.bin
          sudo chown -R $USER out
          # The version inside the binary must match (esp_app_desc_t.version at offset 48)
          INSIDE=$(dd if=out/pocketos.bin bs=1 skip=48 count=32 2>/dev/null | tr -d '\0')
          [ "$INSIDE" = "$VER" ] || { echo "::error::binary says '$INSIDE', expected '$VER'"; exit 1; }
          # Sign it. Devices only install updates signed with the release key (POCKETOS_SIGNING_KEY);
          # the public half is firmware/main/esp/signing_key.pem. Without the key, nothing is published.
          [ -n "$SIGNING_KEY" ] || { echo "::error::The POCKETOS_SIGNING_KEY secret is missing: add it under Settings > Secrets and variables > Actions"; exit 1; }
          umask 077; printf '%s\n' "$SIGNING_KEY" > key.pem
          openssl dgst -sha256 -sign key.pem -out sig.der out/pocketos.bin
          rm -f key.pem
          openssl dgst -sha256 -verify firmware/main/esp/signing_key.pem -signature sig.der out/pocketos.bin \
            || { echo "::error::The signing key doesn't match the public key in the firmware"; exit 1; }
          python3 - <<'PY'
          sig = open("sig.der", "rb").read()
          assert 8 <= len(sig) <= 72 and sig[0] == 0x30
          trailer = sig + bytes(72 - len(sig)) + len(sig).to_bytes(2, "little") + b"PSIG01"
          open("out/pocketos.bin", "ab").write(trailer)
          PY
          SIZE=$(stat -c %s out/pocketos.bin)
          SHA=$(sha256sum out/pocketos.bin | cut -d' ' -f1)
          FULLSHA=$(sha256sum out/pocketos-full.bin | cut -d' ' -f1)
          python3 - "$VER" "$SIZE" "$SHA" "$GITHUB_REPOSITORY" "$FULLSHA" "$ROLLOUT" <<'PY'
          import json, sys
          ver, size, sha, repo, full_sha, rollout = sys.argv[1:]
          rollout = int(rollout)
          assert 1 <= rollout <= 100, "rollout must be 1 to 100"
          notes = open("notes.md").read().strip()[:390]
          json.dump({"version": ver, "size": int(size), "sha256": sha, "notes": notes, "full_sha256": full_sha, "rollout": rollout,
                     "url": f"https://github.com/{repo}/releases/download/v{ver}/pocketos.bin"},
                    open("out/manifest.json", "w"), indent=2)
          PY
          cat out/manifest.json
          # The factory tool, with this release's firmware already inside (for flashing new devices)
          mkdir -p pkg/pocketos-factory
          cp tools/factory/* pkg/pocketos-factory/
          cp out/pocketos-full.bin pkg/pocketos-factory/
          python3 -c "import json; m=json.load(open('out/manifest.json')); json.dump({'version': m['version'], 'full_sha256': m['full_sha256']}, open('pkg/pocketos-factory/pocketos-full.bin.json', 'w'))"
          (cd pkg && zip -qr ../out/pocketos-factory.zip pocketos-factory)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.v.outputs.version }}
          gh release create "v$VER" out/pocketos.bin out/pocketos-full.bin out/manifest.json out/pocketos-factory.zip \
            --title "PocketOS $VER" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Update the website
        # Vercel rebuilds the site, which fetches this release for the browser installer.
        # Set up once: see docs/website.md (VERCEL_DEPLOY_HOOK secret). The release is already
        # published at this point, so a problem here only warns.
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::notice::VERCEL_DEPLOY_HOOK isn't set, so the website keeps the previous installer until its next deploy"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK" || echo 000)
          case "$code" in 2*) echo "Website rebuild started";;
            *) echo "::warning::Vercel answered $code. Check VERCEL_DEPLOY_HOOK is the Deploy Hook link (https://api.vercel.com/v1/integrations/deploy/...) from Vercel → Settings → Git → Deploy Hooks";; esac
